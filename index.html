<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Ex">
<title>Life Exercises</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff6a3d'/%3E%3Cpath d='M18 34l9 9 19-21' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f3; --text:#14161a; --muted:#6b7280; --line:#e3e6ea;
  --accent:#ff6a3d; --accent-ink:#ffffff; --accent-soft:#ffe8df; --done:#1fae5b; --done-soft:#dcf5e6;
  --warn:#d97706; --ring-track:#e6e8ec; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.06);
  --heat0:#e9ecef; --heat1:#ffd3c2; --heat2:#ffab8b; --heat3:#ff8456; --heat4:#ff6a3d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --surface:#181b21; --surface2:#20242c; --text:#f2f3f5; --muted:#9aa2ae; --line:#2a2f38;
    --accent:#ff7a4f; --accent-ink:#1a0d07; --accent-soft:#3a2219; --done:#34d27b; --done-soft:#143524;
    --ring-track:#2a2f38; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --heat0:#20242c; --heat1:#4a2a1f; --heat2:#7a3a24; --heat3:#c4552d; --heat4:#ff7a4f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 160px)}
h1{font-size:30px;line-height:1.1;margin:4px 0 2px;letter-spacing:-.02em;font-weight:800}
h2{font-size:19px;margin:22px 0 10px;letter-spacing:-.01em;font-weight:750}
.eyebrow{font-size:13px;font-weight:650;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--done-soft);color:var(--done)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font-weight:700;font-size:16px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.done{background:var(--done);color:#fff}
.btn:active{transform:scale(.98)}
.progressbar{height:8px;border-radius:99px;background:var(--ring-track);overflow:hidden}
.progressbar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
/* session cards on Today */
.scard{display:flex;gap:14px;align-items:center;padding:16px;margin-top:12px}
.scard .title{font-weight:750;font-size:17px}
.scard .meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.ring{flex:none}
.ring text{font-weight:800;fill:var(--text)}
.chev{color:var(--muted);flex:none}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);margin-top:8px;box-shadow:var(--shadow)}
.opt .t{font-weight:650}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.badge.big{width:52px;height:52px;border-radius:16px}
.badge.g{background:var(--done-soft);color:var(--done)}
.banner{margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--done-soft);color:var(--done);font-weight:650;display:flex;gap:10px;align-items:center}
.linkbtn{color:var(--accent);font-weight:650;font-size:14px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px)}
.tabbar .in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:650;color:var(--muted)}
.tab.on{color:var(--accent)}
/* plan grid */
.wk{margin-top:12px;padding:14px}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dt{aspect-ratio:.78;border-radius:14px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 2px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.dt .ic{color:var(--text);opacity:.85}
.dt.done{background:var(--done);color:#fff}
.dt.done .ic{color:#fff;opacity:1}
.dt.next{outline:2.5px solid var(--accent);outline-offset:-2.5px;background:var(--accent-soft);color:var(--accent)}
.dt.next .ic{color:var(--accent)}
.dt .mini{width:100%;height:4px;border-radius:9px;background:var(--ring-track);overflow:hidden;margin:0 5px;max-width:30px}
.dt .mini i{display:block;height:100%;background:var(--accent)}
.dt.done .mini{display:none}
.dt.sel{outline:2.5px solid var(--accent);outline-offset:-2.5px;background:var(--accent-soft);color:var(--accent)}
.dt.sel .ic{color:var(--accent)}
.dt.done.sel{background:var(--done);color:#fff;outline-offset:2px}
.dt.done.sel .ic{color:#fff}
.dt.nextdot::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
/* session overlay */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.overlay.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.ohead{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;border-bottom:1px solid var(--line)}
.ohead .in{max-width:560px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:650;height:36px}
.obody{max-width:560px;margin:0 auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 120px)}
.ex{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:18px;padding:14px;margin-top:10px;box-shadow:var(--shadow);transition:opacity .2s}
.ex.on{opacity:.62}
.ex.on .exname{text-decoration:line-through;text-decoration-thickness:1.5px}
.chk{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex:none;margin-top:2px;transition:all .15s;color:transparent}
.ex.on .chk{background:var(--done);border-color:var(--done);color:#fff}
.chk:active{transform:scale(.9)}
.exbody{flex:1;min-width:0}
.exname{font-weight:700;font-size:16px}
.exdose{font-weight:750;font-size:15px;margin-top:3px;color:var(--accent)}
.exload{font-size:13.5px;color:var(--muted);margin-top:2px}
.ids{font-size:11.5px;color:var(--muted);margin-top:6px;letter-spacing:.01em}
.sub{font-size:11px;font-weight:700;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
.info{flex:none;color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--surface2);margin-top:3px}
.note{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-top:10px}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:3}
.sticky-cta .in{max-width:560px;margin:0 auto}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;padding:10px 18px calc(env(safe-area-inset-bottom) + 24px)}
.sheet.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet .in{max-width:560px;margin:0 auto}
.glink{display:block;text-decoration:none;color:inherit;margin-bottom:6px}.glink h3{margin:0}.glink .small{color:var(--accent);font-weight:650}.gicon{color:var(--accent);vertical-align:-2px}
.grab{width:44px;height:6px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:21px;margin:0 0 6px;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin-top:14px;font-size:14.5px}
.kv b{color:var(--muted);font-weight:650;font-size:13px;padding-top:1px}
.steps{margin:6px 0 0;padding-left:20px}
.steps li{margin:4px 0}
.sec{margin-top:16px}
.sec .lab{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:14px;padding:10px 12px;font-size:14.5px}
.timers{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tchip{height:40px;padding:0 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.ez{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ez div{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:14px}
.ez .lab{margin-bottom:2px}
/* timer pill */
.timer{position:fixed;left:50%;transform:translate(-50%,160%);bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:50;background:var(--text);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .25s,opacity .2s;min-width:250px;opacity:0;pointer-events:none}
.timer.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.timer .tt{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;letter-spacing:.02em}
.timer .tl{font-size:12px;opacity:.7;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:800;font-size:13px}
.timer.end{background:var(--done)}
/* progress */
.hero{display:flex;gap:18px;align-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.tile .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile .l{font-size:13px;color:var(--muted);margin-top:2px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:15px;height:15px;border-radius:4px;background:var(--heat0);display:block}
.bars .b{display:grid;grid-template-columns:118px 1fr 40px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
.bars .b .progressbar{height:10px}
.bars .b .pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.recent{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.recent:last-child{border-bottom:0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-150%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:650;font-size:14px;z-index:60;transition:transform .25s,opacity .2s;max-width:90vw;text-align:center;opacity:0;visibility:hidden;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.danger{color:#e5484d;font-weight:650;font-size:14px}

/* ---- v2 additions ---- */
:root{--joker:#7c5cff;--joker-soft:#ece7ff;--move:#3b82f6;--move-soft:#e3edff;--brk:#0ea5a4}
@media (prefers-color-scheme: dark){:root{--joker:#9b85ff;--joker-soft:#2a2346;--move:#5b9bff;--move-soft:#1b2a44;--brk:#2cc6c4}}
.hero2{padding:18px;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.howto{margin-top:12px}
.secbox{margin-top:12px;padding:14px 16px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sechead .t{font-weight:800;font-size:16px}
.rule{font-size:13.5px;color:var(--muted);margin-top:4px}
.rule b{color:var(--text)}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-of-type{border-top:0}
.num{width:28px;height:28px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:13.5px;flex:none}
.li.abs .num{background:var(--accent-soft);color:var(--accent)}
.li .nm{font-weight:700;font-size:15.5px}
.li .gd{font-size:13px;color:var(--muted);margin-top:1px}
.li .sd{font-size:11.5px;font-weight:700;color:var(--move);margin-top:2px}
.absdiv{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:10px 0 2px;border-top:1px dashed var(--line)}
.arrow{font-size:12.5px;color:var(--muted);padding:2px 0 0 40px}
.seq{font-size:14px;line-height:1.55}
.seq .s{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.seq .s:first-child{border-top:0}
.seq .s.run b{color:var(--accent)}
.jcard{background:linear-gradient(135deg,var(--joker),color-mix(in srgb,var(--joker) 60%,#ff6a3d));color:#fff;border-radius:20px;padding:16px;margin-top:14px;display:flex;gap:14px;align-items:center;width:100%;text-align:left;box-shadow:var(--shadow)}
.jcard .t{font-weight:800;font-size:16.5px}
.jcard .s{font-size:13px;opacity:.9}
.jcard .badge{background:rgba(255,255,255,.2);color:#fff}
.optc{padding:14px 16px;margin-top:10px}
.mini-btn{height:38px;padding:0 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:750;font-size:14px;display:inline-flex;align-items:center;gap:6px;flex:none}
.mini-btn.done{background:var(--done-soft);color:var(--done)}
.mini-btn.ghost{background:var(--surface2);color:var(--text)}
.dt.jok{background:var(--joker);color:#fff}.dt.jok .ic{color:#fff;opacity:1}
.navd{display:flex;gap:8px;margin-top:6px}
.navd button{flex:1;height:40px;border-radius:12px;background:var(--surface2);font-weight:650;font-size:14px;color:var(--muted)}
/* player */
.player{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.player.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ptop{padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;max-width:560px;width:100%;margin:0 auto}
.ptop .row{gap:10px}
.pclose{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.ptitle{font-weight:750;font-size:15px}
.pmeta{font-size:12.5px;color:var(--muted)}
.pbar{height:6px;border-radius:9px;background:var(--ring-track);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.pmain{flex:1;overflow-y:auto;max-width:560px;width:100%;margin:0 auto;padding:6px 16px 10px}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.phase.move{background:var(--move-soft);color:var(--move)}
.phase.brk{background:color-mix(in srgb,var(--brk) 16%,transparent);color:var(--brk)}
.phase.walk{background:var(--done-soft);color:var(--done)}
.pname{font-size:30px;font-weight:850;letter-spacing:-.02em;line-height:1.1;margin:12px 0 4px;display:flex;align-items:flex-start;gap:8px;text-align:left;width:100%}
.pname .i{flex:none;margin-top:6px;color:var(--muted)}
.pguide{font-size:16px;font-weight:700;color:var(--accent)}
.pside{display:inline-block;margin-top:8px;font-size:13px;font-weight:750;color:var(--move);background:var(--move-soft);padding:4px 10px;border-radius:99px}
.pclock{display:flex;justify-content:center;margin:14px 0 6px;position:relative}
.pclock .big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pclock .big b{font-size:56px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.pclock .big span{font-size:13px;color:var(--muted);font-weight:650;margin-top:4px}
.pcount{text-align:center;font-size:14px;font-weight:700;color:var(--muted)}
.pnext{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.pnext .l{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pnext .n{font-weight:750}
.pcues{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface2);font-size:14.5px}
.pcues ol{margin:6px 0 0;padding-left:20px}.pcues li{margin:3px 0}
.pcues .lab{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pctl{padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);max-width:560px;width:100%;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:center}
.pctl button{width:58px;height:58px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.pctl .pp{width:78px;height:78px;background:var(--accent);color:var(--accent-ink)}
.pctl .snd{width:44px;height:44px;font-size:12px;font-weight:800;color:var(--muted)}
.pdone{text-align:center;padding:40px 10px}
.pdone h2{font-size:28px;margin:16px 0 6px}
.pstart{text-align:center;padding:20px 4px}
</style>
</head>
<body>
<div class="app">
  <section id="v-today" class="view on"></section>
  <section id="v-plan" class="view"></section>
  <section id="v-progress" class="view"></section>

<script>
const DATA = {"ex":{"march":{"n":"March with arm circles","lib":["A2.4#8"],"eq":"None","side":"","g":"Steady pace, about 2 steps a second","set":"Stand tall, feet hip-width apart.","st":["March on the spot, lifting each knee to about hip height.","At the same time, circle both arms: big slow forward circles for the first half, then backward circles.","Land softly on the balls of your feet, then let the heel touch down."],"br":"Breathe freely through the nose if you can.","feel":"Your body warming up and shoulders loosening.","bad":["Leaning back to lift the knees.","Tiny arm circles. Make them as big as is comfortable."],"e":"Lower knee lift, smaller circles.","h":"Faster march with higher knees."},"catcamel":{"n":"Cat–camel","lib":["A3.2#11"],"eq":"Mat","side":"","g":"5–6 slow cycles","set":"On hands and knees on the mat. Hands under shoulders, knees under hips.","st":["Round your back up toward the ceiling, starting from the tailbone and finishing with the head dropping. Push the floor away with your hands.","Then reverse: let the belly sink, tilt the tailbone up, lift the chest and look slightly forward.","Move slowly, one vertebra at a time. About 3 seconds each way."],"br":"Breathe out as you round, breathe in as you arch.","feel":"The whole spine moving, especially the mid-back.","bad":["Moving only at the low back or neck.","Bending the elbows. Keep the arms straight."],"e":"Smaller range.","h":"Pause 2 seconds at each end."},"bwsquat":{"n":"Bodyweight squat (slow)","lib":["A1.1#2","A7.3#5"],"eq":"None","side":"","g":"8–10 slow reps","set":"Feet shoulder-width apart, toes turned out slightly. Arms straight out in front for balance.","st":["Push the hips back and bend the knees together, lowering over about 2 seconds.","Go as deep as you can while the heels stay down and the chest stays up. Aim for thighs at least parallel to the floor.","Knees travel in the direction of the toes.","Stand back up by pushing the floor away through the whole foot."],"br":"Breathe in on the way down, out on the way up.","feel":"Thighs and glutes warming.","bad":["Heels lifting.","Knees caving inward."],"e":"Squat to a chair or the bottom stair.","h":"Pause 2 s at the bottom."},"hfreach":{"n":"Half-kneeling hip-flexor stretch with reach","lib":["A3.1#2","A5.1#11"],"eq":"Mat","side":"switch","g":"Rock in and out, 4–5 times each side","set":"Kneel on the mat with the left knee down and the right foot flat in front, both knees bent about 90°.","st":["Squeeze the left glute and tuck the tailbone under (tilt the pelvis back). You should already feel the front of the left hip.","Keeping that tuck, shift the body slightly forward and reach the left arm straight up and a little toward the right.","Hold for 2 seconds, come back, repeat.","Halfway through: swap legs (right knee down, left arm reaches)."],"br":"Breathe out as you reach.","feel":"A stretch at the front of the hip of the down knee.","bad":["Arching the low back instead of tucking the pelvis. If you arch, you lose the stretch."],"e":"Smaller forward shift.","h":"Hold each reach 5 s."},"gobsquat":{"n":"Backpack goblet squat","lib":["A1.1#1","A7.3#5","A3.2#7"],"eq":"Backpack (5–15 kg: books or water bottles)","side":"","g":"10–12 reps","set":"Pack the backpack so it is firm. Hold it upright against your chest, hugging it with both arms, elbows pointing down. Feet shoulder-width apart, toes turned out 10–20°.","st":["Brace your stomach as if someone is about to poke it.","Push the hips back and bend the knees, lowering under control for about 2 seconds.","Keep the chest up and the backpack tight against your chest. Elbows go down between the knees.","Go down until the thighs are at least parallel to the floor, or lower if your heels stay down.","Drive up through the whole foot to standing and squeeze the glutes at the top."],"br":"Breathe in at the top before going down, breathe out as you stand up.","feel":"Front of thighs and glutes.","bad":["Heels lifting or weight on the toes.","Knees collapsing inward. Push them out over the toes.","Rounding the back at the bottom."],"e":"No backpack, or squat to the bottom stair.","h":"Heavier backpack, or 3 s down and 1 s pause at the bottom."},"slbridge":{"n":"Single-leg glute bridge (alternating)","lib":["A1.3#5","A1.1#4","A1.3#3"],"eq":"Mat","side":"alt","g":"5–6 per leg","set":"Lie on your back, knees bent, feet flat and hip-width apart, heels about 20–30 cm from your bottom. Arms on the floor by your sides.","st":["Straighten one leg so it points up at about 45°, or simply lift that foot off the floor with the knee still bent.","Push through the heel of the foot on the floor and lift the hips until there is a straight line from shoulders to knee.","Squeeze the glute hard at the top for 1 second. Keep the hips level and do not let the free side drop.","Lower the hips until they lightly touch the floor, put the foot down, and do the next rep with the other leg."],"br":"Breathe out as you lift, in as you lower.","feel":"Glute and hamstring of the leg on the floor.","bad":["Arching the low back to get higher. Stop when the body is in a straight line.","Hips tilting to one side.","Pushing through the toes, which shifts the work to the thigh."],"e":"Both feet on the floor (normal glute bridge).","h":"Heel on the bottom stair or a sofa for a bigger range."},"revlunge":{"n":"Alternating reverse lunge","lib":["A3.3#5","A5.3#10","A1.1#5"],"eq":"None (backpack optional)","side":"alt","g":"6–8 per leg","set":"Stand tall, feet hip-width apart, hands on your hips or holding the backpack against your chest.","st":["Take a long step backward with one foot, landing on the ball of that foot.","Bend both knees and lower straight down until the back knee is 2–3 cm above the floor. The front shin stays roughly vertical.","Keep your weight mostly on the front heel and your chest up.","Push through the front heel to step back to standing, then step back with the other leg."],"br":"Breathe in going down, out as you push up.","feel":"Glute and thigh of the front leg.","bad":["Step too short, so the front knee shoots far forward and the heel lifts.","Slamming the back knee into the floor.","Leaning far forward or twisting."],"e":"Shorter range: lower only halfway, holding a wall or door frame for balance.","h":"Hold the backpack, or pause 1 s at the bottom."},"rapidsts":{"n":"Rapid sit-to-stand","lib":["A1.2#6","A1.3#1"],"eq":"Chair or sofa","side":"","g":"As many fast reps as you can with good form (about 11–14)","set":"Sit on the front half of a firm chair, feet flat and hip-width apart, slightly behind the knees. Cross your arms over your chest.","st":["Lean forward slightly ('nose over toes').","Stand up as FAST as you can, finishing tall with the hips fully straight and the glutes squeezed. Feet stay on the floor; do not jump.","Sit back down under control in about 2 seconds. Touch the seat lightly; do not flop.","Immediately explode up again."],"br":"Breathe out hard on each stand.","feel":"Thighs and glutes, and your heart rate rising. This is the power move of the day.","bad":["Using the arms or swinging them.","Not standing up fully at the top.","Dropping onto the chair."],"e":"Higher seat (e.g. the sofa arm).","h":"Lower seat, or hold the backpack to your chest."},"calfstep":{"n":"Calf raise on a step","lib":["A8.2#1","A5.3#9","A1.1#10"],"eq":"Bottom stair","side":"","g":"6–8 slow reps","set":"Stand on the bottom stair with only the balls of your feet on the edge; heels hang off. Hold the banister or wall lightly for balance.","st":["Let the heels sink below the step until you feel a calf stretch (about 2 seconds).","Rise up as high as you can onto the balls of your feet, through the big toe, and hold the top for 1 second.","Lower slowly over 2–3 seconds back to the stretch."],"br":"Breathe normally.","feel":"Calves (back of the lower leg).","bad":["Bouncing quickly at the bottom.","Only half the range: go fully up and fully down.","Rolling onto the little toes."],"e":"Flat floor instead of the step.","h":"Single leg: switch legs halfway through the time."},"trxfallout":{"n":"TRX fallout (ab rollout)","lib":["A1.1#19"],"eq":"TRX, straps long (handles hanging at about knee to mid-calf height)","side":"","g":"8–12 reps","set":"Face away from the anchor. Hold the handles with straight arms in front of your chest at shoulder height, palms down. Step your feet back toward the anchor until you lean forward a little. The more you lean, the harder it is. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)","st":["Squeeze glutes, tuck the tailbone under, and pull the ribs down so your body is one straight plank from heels to head.","Keeping the arms straight, let the arms rise forward and overhead while your body falls forward as one piece.","Go only as far as you can WITHOUT your low back arching (often until the arms are beside the ears).","Pull the arms back down toward the hips, using your abs, to return to the start."],"br":"Breathe in as you fall out, breathe out hard as you pull back.","feel":"Whole front of the stomach, working hard to stop the back from arching.","bad":["Low back sagging or arching at the far point. This is the most important thing to avoid.","Bending at the hips (bum sticking out) to come back.","Bending the elbows."],"e":"Stand more upright, or do it from your knees.","h":"Feet further back so you lean more, or go further overhead."},"woodchop":{"n":"Band horizontal chop (standing rotation)","lib":["A1.1#28"],"eq":"Band anchored in a door at chest height","side":"switch","g":"5–7 per side","set":"Anchor the band at chest height. Stand side-on to the door, an arm's length plus a step away so the band is tight. Feet wider than hips, knees soft. Hold the band with both hands, arms nearly straight, in front of the shoulder nearest the door. Anchor on the side of the door that pulls it shut (the door opens away from you); lock it if you can.","st":["Brace the stomach.","Turn your hips, chest and arms TOGETHER away from the door, pivoting on the foot nearest the door (heel turns out, like squashing a bug), until the hands are in front of the far shoulder.","Arms stay long and stay in front of your chest the whole time.","Return slowly for 2 seconds, resisting the band.","Halfway through the time: turn around and work the other side."],"br":"Breathe out as you turn away, in as you return.","feel":"Obliques (sides of the waist) and the whole trunk.","bad":["Keeping the hips still and twisting only from the waist.","Letting the band yank you back quickly.","Pulling with the arms instead of turning the body."],"e":"Step closer to the door (less tension).","h":"Step further away, or pause 2 s at the end."},"revcrunch":{"n":"Reverse crunch","lib":["A1.4#17","A1.1#23"],"add":true,"eq":"Mat","side":"","g":"8–10 slow reps","set":"Lie on your back, arms on the floor by your sides with palms down. Lift your legs so the hips and knees are both bent at 90° (shins parallel to the floor).","st":["Press the low back into the floor.","Using your lower stomach, curl the pelvis up off the floor so the knees move toward your chest and the bottom rises 3–5 cm. Think 'roll up', not 'swing'.","Pause for 1 second at the top.","Lower the pelvis slowly over 2–3 seconds back to the start, keeping the knees bent at 90°."],"br":"Breathe out as you curl up.","feel":"Lower part of the stomach (below the belly button).","bad":["Swinging the legs to create momentum.","Pushing hard with the hands.","Letting the low back arch when lowering."],"e":"Smaller lift, or feet resting on the floor between reps.","h":"Slower (3 s up, 3 s down), or legs straighter."},"trxrow":{"n":"TRX row","lib":["A1.1#14","A1.4#12","A4.2#17"],"eq":"TRX, straps short (fully shortened)","side":"","g":"8–10 reps","set":"Face the anchor and hold one handle in each hand, palms facing each other. Walk your feet toward the anchor and lean back with straight arms until your body is a straight plank, heels on the floor. The more upright you are, the easier it is. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)","st":["Squeeze the glutes and keep the body straight from head to heels.","Pull your chest up to the handles by driving your elbows back, close to your sides. First squeeze the shoulder blades together, then pull.","At the top, the handles are beside your ribs. Hold 1 second.","Lower slowly over 2 seconds until the arms are straight again."],"br":"Breathe out as you pull, in as you lower.","feel":"Upper back between the shoulder blades and the back of the shoulders; a little biceps.","bad":["Hips sagging (body not a straight line).","Shrugging the shoulders up to the ears.","Dropping down fast."],"e":"Stand more upright.","h":"Walk the feet further forward (more horizontal), or pause 2 s at the top."},"pushup":{"n":"Push-up","lib":["A7.1#16","A1.3#11","A1.1#12"],"eq":"Floor","side":"","g":"8–15 reps (or as many good reps as possible)","set":"Hands on the floor slightly wider than your shoulders, fingers forward. Legs straight back, feet together or hip-width. Body is a straight line from head to heels.","st":["Squeeze glutes and stomach so the hips stay in line.","Bend the elbows to lower your chest toward the floor for 2 seconds. Elbows point back at about 45° from your body, not straight out to the sides.","Go down until the chest is a fist's height from the floor.","Push the floor away to straighten the arms fully."],"br":"Breathe in down, out up.","feel":"Chest, front of the shoulders, triceps; stomach works to hold the plank.","bad":["Hips sagging or pike up.","Elbows flared straight out at 90°.","Head dropping forward. Look at the floor slightly ahead of your hands.","Half reps."],"e":"Hands on a stair, the sofa or a table edge (higher = easier), or knees down.","h":"Feet on the bottom stair, or 3 s lowering."},"bandpress":{"n":"Band overhead press","lib":["A1.1#13","A1.4#9","A7.3#10"],"eq":"Band","side":"","g":"10–15 reps","set":"Stand on the middle of the band with feet hip-width apart. Hold one end in each hand at shoulder height, palms facing forward, elbows slightly in front of your body.","st":["Brace the stomach and squeeze the glutes so you do not lean back.","Press both hands straight up until the arms are fully straight and your biceps are next to your ears.","At the top, push up a bit further as if reaching for the ceiling.","Lower under control for 2 seconds back to shoulder height."],"br":"Breathe out as you press up.","feel":"Shoulders and triceps.","bad":["Leaning back and arching the low back to finish.","Pressing forward instead of straight up.","Shrugging the shoulders at the bottom."],"e":"Lighter band, or press one arm at a time.","h":"Thicker band, or a staggered stance on half the band (more tension)."},"trxy":{"n":"TRX Y raise","lib":["A1.1#30","A3.2#20"],"eq":"TRX, straps short","side":"","g":"10–12 reps","set":"Face the anchor and hold the handles with straight arms in front of you at chest height, palms facing down. Lean back slightly; start almost upright, because this one is hard. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)","st":["Keep the arms STRAIGHT the whole time.","Pull your body up by raising the arms up and out into a 'Y' shape above your head, thumbs pointing up.","Squeeze the shoulder blades down and back at the top; do not shrug.","Lower slowly back to the start."],"br":"Breathe out as you raise.","feel":"Lower part of the upper back, below and between the shoulder blades. This is your main posture muscle.","bad":["Bending the elbows.","Shrugging toward the ears.","Arching the low back. Keep the glutes squeezed."],"e":"Stand more upright.","h":"Lean back more, or pause 2 s at the top."},"trxcurl":{"n":"TRX biceps curl","lib":["A1.4#14","A3.2#21","A7.2#21"],"eq":"TRX, straps short","side":"","g":"10–15 reps","set":"Face the anchor, holding the handles with palms facing up, arms straight in front of you at shoulder height. Lean back with the body straight. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)","st":["Keep the upper arms still and at shoulder height.","Bend only at the elbows to curl your hands toward your forehead. Your body moves up toward the anchor.","Squeeze the biceps for 1 second.","Straighten the arms slowly to lower back."],"br":"Breathe out as you curl.","feel":"Biceps (front of the upper arm).","bad":["Elbows dropping down, which turns it into a row.","Hips sagging."],"e":"Stand more upright.","h":"Walk the feet forward."},"bandcrunch":{"n":"Kneeling band crunch","lib":["A1.4#17"],"eq":"Band anchored HIGH (top of a door)","side":"","g":"8–10 reps","set":"Anchor the band at the top of the door. Kneel facing it, about an arm's length away, with a pad under the knees. Hold the band ends beside your forehead, by the ears. Hinge slightly so the hips are just behind the knees; this hip angle stays fixed for the whole set. Anchor on the side of the door that pulls it shut (the door opens away from you); lock it if you can.","st":["Keep the hips still; do not sit back further.","Curl the ribs down toward the pelvis by rounding the spine, bringing the elbows down toward the middle of your thighs.","Squeeze the stomach hard for 1 second at the bottom.","Uncurl slowly back up for 2 seconds until upright and you feel the stomach stretch."],"br":"Breathe OUT fully as you curl down.","feel":"Upper and middle of the stomach (the 'six-pack' muscle).","bad":["Bending at the hips (bowing) instead of rounding the spine.","Pulling with the arms. Hands stay glued beside your head."],"e":"Lighter band, or no band: a floor crunch.","h":"Thicker band, or shuffle back on your knees for more tension."},"sideplank":{"n":"Side plank","lib":["A1.3#20"],"eq":"Mat","side":"switch","g":"Hold the whole half on each side","set":"Lie on your side, forearm on the floor with the elbow directly under the shoulder. Legs straight and stacked, top foot in front of the bottom foot if needed for balance.","st":["Lift the hips off the floor until your body is a straight line from head to feet.","Keep the top hip stacked over the bottom hip; do not roll forward or back.","Push the floor away with the forearm so the shoulder does not sink.","Hold. Halfway through: lower down, roll over and do the other side."],"br":"Breathe slowly and normally.","feel":"Side of the waist (obliques) of the side nearest the floor, and the side of the hip.","bad":["Hips sagging toward the floor.","Rolling the chest toward the floor.","Head dropping."],"e":"Bottom knee bent and on the floor.","h":"Lift the top leg, or do hip dips (lower the hip 5 cm and lift back up)."},"deadbug":{"n":"Dead bug","lib":["A8.3#10","A3.2#1"],"add":true,"eq":"Mat","side":"alt","g":"4–5 slow reps per side","set":"Lie on your back. Arms pointing straight up to the ceiling. Lift your legs so the hips and knees are bent at 90° (shins parallel to the floor).","st":["Press your low back flat into the floor; keep it there the whole time.","Slowly lower one arm behind your head and the OPPOSITE leg straight out, heel hovering 5–10 cm above the floor (2–3 seconds).","Bring them back to the start.","Repeat with the other arm and leg."],"br":"Breathe out slowly as you extend the arm and leg.","feel":"Deep in the stomach, holding the low back flat.","bad":["Low back lifting off the floor. If this happens, don't extend the leg as far.","Moving fast."],"e":"Move only the legs, or tap the heel on the floor with the knee still bent.","h":"Slower (4 s out), or hold a light band between your hands."},"stepup":{"n":"Stair step-up (alternating, fast)","lib":["A5.3#1","A1.3#4","A2.1#9"],"eq":"Stairs (one or two steps up)","side":"alt","g":"As many controlled reps as possible, about 20 total","set":"Stand facing the stairs. Use the 2nd step if you can drive up without pushing off the back foot, otherwise use the 1st.","st":["Put your whole right foot on the step.","Drive through the right heel to stand up straight on the step. Bring the left foot up next to it.","Step back down with the left foot first, then the right.","Next rep: lead with the left foot. Keep a quick, steady rhythm and swing the arms like walking."],"br":"Breathe rhythmically.","feel":"Glutes and thighs; heart rate up.","bad":["Pushing off the floor foot instead of the step foot.","Half the foot hanging off the step.","Front knee collapsing inward."],"e":"Lower step, slower pace.","h":"Higher step, or hold the backpack."},"slrdl":{"n":"Single-leg Romanian deadlift","lib":["A7.2#13","A1.1#3","A4.2#10"],"eq":"Backpack (optional)","side":"switch","g":"4–5 per leg","set":"Stand on your right leg with a slight bend in the knee. Hold the backpack in the left hand (the hand opposite the standing leg), or nothing.","st":["Hinge forward at the hip: the chest goes down while the free leg goes straight back, as if your body is a seesaw.","Keep the back flat and the hips square to the floor; the toes of the back leg point down.","Lower until your body is nearly parallel to the floor or you feel a strong stretch in the back of the standing leg.","Squeeze the glute of the standing leg to come back up to standing.","Halfway through: switch legs (and hands)."],"br":"Breathe in as you hinge, out as you stand.","feel":"Hamstring and glute of the standing leg. Balance work for the foot and ankle.","bad":["Rounding the back.","Hip of the lifted leg opening up toward the ceiling.","Bending the standing knee a lot (it becomes a squat)."],"e":"Touch the free toe on the floor behind you for balance (kickstand), or hold a wall.","h":"Heavier backpack, or 3 s lowering."},"latlunge":{"n":"Lateral lunge (alternating)","lib":["A3.2#5","A7.4#5"],"eq":"None","side":"alt","g":"5–6 per side","set":"Stand with feet together, hands clasped in front of your chest.","st":["Take a big step out to the right (about twice shoulder-width), toes pointing forward.","Sit back into the right hip, bending the right knee while the left leg stays straight. Chest up, right heel down.","Go down until the right thigh is close to parallel to the floor or you feel a stretch on the inside of the left thigh.","Push hard off the right foot to return to feet together. Then go to the left."],"br":"Breathe in down, out pushing back.","feel":"Glutes and thighs of the bent leg; inner thigh stretch of the straight leg. This trains side-to-side movement.","bad":["Bent knee caving inward past the toes.","Heel lifting.","Rounding forward."],"e":"Smaller step, less depth.","h":"Hold the backpack at your chest."},"copen":{"n":"Copenhagen plank (short lever)","lib":["A1.1#9","A7.2#15"],"eq":"Sofa seat, low bench or sturdy chair (about knee height); the bottom stair is usually too low","side":"switch","g":"Hold for each half","set":"Lie on your left side with the left forearm on the floor, elbow under the shoulder. Put the inside of your RIGHT (top) knee on the sofa seat or chair edge; the left leg hangs underneath.","st":["Press the top knee down into the support and lift your hips until the body is straight from head to knee.","Lift the bottom leg up toward the top leg (with a sofa or bench, touch its underside), or simply let it hang to start.","Hold, keeping the hips stacked and not rolling forward.","Halfway through: switch sides."],"br":"Breathe normally.","feel":"Inner thigh (adductors) of the top leg, plus the side of the waist.","bad":["Hips dropping.","Rolling the chest down to the floor."],"e":"Hold for less time and rest the bottom foot on the floor.","h":"Put the inside of the top ANKLE on the support (long lever)."},"wallsit":{"n":"Wall sit","lib":["A1.3#2","A7.4#9"],"eq":"Wall","side":"","g":"Hold the whole time","set":"Stand with your back against a wall, feet about 50 cm in front of it, shoulder-width apart.","st":["Slide down the wall until your knees are bent at about 90° (thighs nearly parallel to the floor), knees directly above the ankles.","Keep your back and head flat on the wall and the weight in the heels.","Hold, with the hands crossed on your chest or resting lightly on your thighs (do not push on them)."],"br":"Keep breathing steadily. Don't hold your breath.","feel":"Thighs burning.","bad":["Knees forward past the toes (feet too close to the wall).","Pushing on the thighs with the hands."],"e":"Higher position (knees bent ~60°).","h":"Lower, or lift one heel off the floor (switch halfway)."},"trxtuck":{"n":"TRX knee tuck","lib":["A1.1#23","A1.3#19"],"eq":"TRX, foot cradles at mid-calf height","side":"","g":"8–12 reps","set":"Sit on the floor FACING the anchor and slide your heels into the foot cradles from the front. Cross one leg over the other and roll onto your stomach, so the cradles sit on the tops of your feet and your toes point at the floor. Push up into a straight-arm plank, hands under the shoulders, and walk the hands forward until your feet are roughly under the anchor. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)","st":["Get a strong plank first: glutes squeezed, no sagging.","Pull your knees toward your chest by rounding the low back slightly, bum rising a little.","Pause 1 second.","Push the legs back out slowly to a straight plank."],"br":"Breathe out as you tuck.","feel":"Lower stomach and hip flexors; shoulders and stomach hold the plank.","bad":["Hips sagging when the legs go back.","Shoulders drifting behind the hands."],"e":"No TRX: mountain climbers in slow motion (one knee at a time to the chest from a push-up position).","h":"Pike: keep legs straight and lift the hips high."},"pallof":{"n":"Pallof press","lib":["A1.1#21","A4.2#15"],"eq":"Band anchored in a door at chest height","side":"switch","g":"4–5 per side, 2 s hold each","set":"Stand side-on to the door with the band at chest height. Step away until the band is tight. Feet hip-width, knees soft. Hold the band with both hands at the middle of your chest. Anchor on the side of the door that pulls it shut (the door opens away from you); lock it if you can.","st":["Brace the stomach and squeeze the glutes.","Press the hands straight out in front of your chest until the arms are fully straight. The band will try to twist you toward the door; do not let it.","Hold for 2 seconds, with the hands staying in the middle of your body.","Bring the hands back to the chest. Repeat.","Halfway through: turn around for the other side."],"br":"Breathe out as you press, keep breathing during the hold.","feel":"Obliques and the deep stomach muscles, resisting the twist.","bad":["Letting the torso or hips rotate toward the door.","Standing too close, so there is no tension."],"e":"Step closer to the anchor.","h":"Step further away, or kneel on one knee (half-kneeling)."},"hollow":{"n":"Hollow hold","lib":["A1.3#19"],"add":true,"eq":"Mat","side":"","g":"Hold the whole time (rest 3–5 s if form breaks, then continue)","set":"Lie on your back, legs straight, arms straight by your sides.","st":["Press your low back flat into the floor. This is the whole exercise.","Lift your head and shoulder blades off the floor and reach your hands toward your feet.","Lift your straight legs so the heels are about 15–30 cm off the floor.","Hold that 'banana' shape. If the low back starts to lift off the floor, bend the knees or raise the legs higher."],"br":"Small, steady breaths. Do not hold your breath.","feel":"Whole front of the stomach, especially the lower part.","bad":["Low back arching off the floor.","Pulling the chin into the chest; look at your toes."],"e":"Knees bent to 90° (tuck hollow).","h":"Arms extended overhead beside the ears."},"rdl":{"n":"Backpack Romanian deadlift","lib":["A1.1#3","A3.2#2","A7.1#2"],"eq":"Backpack (as heavy as you have)","side":"","g":"12–15 reps","set":"Stand with feet hip-width apart, holding the backpack by its top handle with both hands in front of your thighs (or wear it on your front). Knees softly bent.","st":["Push the hips straight BACK as if closing a car door with your bottom. The knee bend stays the same.","The backpack slides down close to your thighs as the chest goes forward; the back stays flat.","Stop when you feel a strong stretch in the back of the thighs, usually when the backpack reaches just below the knees.","Squeeze the glutes and drive the hips forward to stand tall."],"br":"Breathe in on the way down, out as you stand.","feel":"Hamstrings and glutes. NOT the low back.","bad":["Rounding the back.","Bending the knees more and turning it into a squat.","Leaning back at the top."],"e":"No load, hands sliding down the thighs.","h":"Heavier backpack, or 3 s lowering."},"burpee":{"n":"Step-back burpee (no jump)","lib":["A2.1#10"],"eq":"Floor","side":"","g":"As many as you can with good form, about 8–12","set":"Stand with feet hip-width apart.","st":["Squat down and put your hands flat on the floor in front of your feet.","Step one foot back, then the other, into a straight-arm plank.","Step one foot forward, then the other, back between the hands.","Stand up tall and reach your arms overhead. That is one rep. Keep moving fast.","Quiet version; no jumping, so it is fine for the flat."],"br":"Breathe rhythmically; it will get hard.","feel":"Everything: legs, shoulders, stomach and heart rate.","bad":["Hips sagging in the plank.","Not standing fully at the top."],"e":"Hands on a chair or stair instead of the floor.","h":"Add a push-up at the bottom."},"trxfly":{"n":"TRX reverse fly","lib":["A3.2#20","A3.2#18"],"eq":"TRX, straps short","side":"","g":"10–12 reps","set":"Face the anchor, holding the handles with palms facing each other, arms straight in front of you at chest height. Lean back a little. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)","st":["With a small fixed bend in the elbows, open the arms out wide to the sides like wings, until they form a 'T' in line with your shoulders.","Squeeze the shoulder blades together at the end and hold for 1 second.","Bring the arms back in front slowly."],"br":"Breathe out as you open.","feel":"Back of the shoulders and between the shoulder blades. Opens up the chest; good against the forward neck.","bad":["Shrugging.","Bending the elbows more as you pull (it becomes a row).","Sagging hips."],"e":"Stand more upright.","h":"Lean back more."},"pushupplus":{"n":"Push-up plus","lib":["A1.1#27"],"eq":"Floor","side":"","g":"8–12 reps","set":"Push-up position: hands under the shoulders, body in a straight line (knees down is fine).","st":["Do a normal push-up.","At the top, when the arms are straight, push the floor away even further: let the shoulder blades slide apart around your ribs so the upper back rounds slightly.","Hold that 'plus' for 1 second, then let the shoulder blades come back together before the next push-up."],"br":"Breathe out on the push and the plus.","feel":"Chest and triceps, plus the serratus muscle on the side of the ribs that keeps your shoulder blades healthy.","bad":["Shrugging toward the ears in the plus.","Hips sagging."],"e":"Hands on the stair or knees down.","h":"Feet on the bottom stair."},"bearcrawl":{"n":"Bear crawl","lib":["A6.1#6"],"eq":"Floor space of about 2–3 m","side":"","g":"Crawl forward 4 steps, backward 4 steps, repeat","set":"On hands and knees, hands under shoulders, knees under hips. Lift your knees 2–5 cm off the floor. Back flat like a table.","st":["Move the right hand and the LEFT foot forward a short step at the same time, then the left hand and right foot.","Keep the knees hovering low and the hips at the same height as the shoulders.","Take 4 small steps forward, then 4 backward. Repeat until time is up.","No room? Bear plank hold: just hold the knees hovering."],"br":"Breathe steadily.","feel":"Shoulders, stomach, thighs. Good for coordination.","bad":["Hips swaying side to side or rising high.","Big steps."],"e":"Bear plank hold (stay still).","h":"Faster, or longer distance."},"bicycle":{"n":"Bicycle crunch (slow)","lib":["A1.4#17","A1.1#28"],"add":true,"eq":"Mat or grass","side":"alt","g":"8–10 per side, slow","set":"Lie on your back, fingertips lightly behind your ears (do not lace fingers), elbows wide. Lift your shoulders off the floor and lift the legs with knees bent at 90°.","st":["Bring your right knee in toward the chest while the left leg extends straight out, 15–30 cm above the floor.","At the same time, rotate the chest so the LEFT shoulder (not just the elbow) turns toward the right knee.","Hold for 1 second, then switch sides in a slow pedalling motion.","Keep the low back pressed down the whole time."],"br":"Breathe out as you twist.","feel":"Obliques and the whole front of the stomach. One of the most effective ab exercises in research.","bad":["Pulling the head with the hands.","Pedalling fast with no rotation.","Low back arching when the leg extends."],"e":"Extend the leg higher.","h":"Even slower, with a 2 s hold."},"birddog":{"n":"Bird dog","lib":["A8.3#10"],"eq":"Mat or grass","side":"alt","g":"3 per side, 3 s hold each","set":"On hands and knees, hands under shoulders, knees under hips, back flat.","st":["Brace the stomach lightly, as if someone is about to nudge you.","Slowly reach your right arm forward and your LEFT leg straight back until both are level with your body. Thumb up, foot flexed.","Hold for 3 seconds without your back moving. Imagine a glass of water on your low back.","Bring them back under you, and switch sides."],"br":"Breathe normally during the hold.","feel":"Deep stomach, low back muscles, glute of the lifted leg.","bad":["Lifting the leg higher than the hip so the back arches.","Hips tipping to one side."],"e":"Lift only the leg, or only the arm.","h":"Touch elbow to knee under your body between reps."},"plank":{"n":"Front plank","lib":["A1.3#19"],"eq":"Mat or grass","side":"","g":"Hold the whole time","set":"Forearms on the floor, elbows under the shoulders. Legs straight back, toes tucked under.","st":["Tuck your tailbone slightly under so the low back flattens, and pull the ribs down toward the hips.","Squeeze the glutes and push the floor away with the forearms.","Keep a straight line from the head to the heels. Look at the floor.","If the hips drop, put the knees down for 3–5 s, then go back up."],"br":"Breathe slowly; don't hold your breath.","feel":"Front of the stomach; it should feel like hard work, not like your low back is hanging.","bad":["Hips sagging.","Bum high in the air.","Shoulders creeping in front of the elbows."],"e":"Knees down.","h":"Alternate lifting each foot 5 cm for 2 s, or plank shoulder taps from straight arms."},"crunch":{"n":"Crunch","lib":["A1.4#17"],"eq":"Mat or grass","side":"","g":"8–10 slow reps","set":"Lie on your back, knees bent, feet flat. Fingertips lightly behind your ears, or arms crossed over your chest.","st":["Curl your head, then shoulders, then upper back off the floor by bringing the ribs toward the pelvis. The lower back stays on the floor.","Lift until the shoulder blades are off the floor.","Squeeze for 1 second at the top.","Lower slowly for 2 seconds."],"br":"Breathe OUT completely as you curl up.","feel":"Upper part of the stomach.","bad":["Pulling on the head.","Jerking up with momentum.","Sitting all the way up (that is hip flexor work)."],"e":"Arms reaching toward the knees.","h":"Arms straight overhead, or a 3 s squeeze at the top."},"sideplankdip":{"n":"Side plank hip dips","lib":["A1.3#20"],"eq":"Mat or grass","side":"switch","g":"7–9 per side","set":"Side plank position: forearm under the shoulder, legs straight and stacked, hips lifted.","st":["Lower the hips 5–10 cm toward the floor without touching it.","Lift them back up, a little higher than a straight line, squeezing the side of the waist.","Keep the movement smooth: 1 second down, 1 second up.","Halfway through: switch sides."],"br":"Breathe out as you lift.","feel":"Side of the waist (obliques) of the bottom side.","bad":["Rotating the chest toward the floor.","Touching down and resting."],"e":"Bottom knee bent on the floor.","h":"Top leg lifted."},"drills":{"n":"Running drills","lib":["A5.2#16","A5.2#17","A2.3#2"],"eq":"Path or grass","side":"","g":"Each drill about 15–20 m, walk back","set":"After the brisk walk, find 20 m of flat path or grass.","st":["High-knee march: walk forward bringing each knee up to hip height, swinging the opposite arm. 20 m.","Butt kicks: easy jog, letting the heels flick up toward your bottom. 20 m.","Side shuffle: stand side-on to the direction you're travelling, knees bent, and step-together quickly without the feet crossing. 15 m each way.","Grapevine (carioca): stand side-on to the direction you're travelling. The trailing foot (furthest from where you're going) crosses in front, then behind, letting the hips turn. 15 m each way.","Two strides: run 20 m, smoothly building to about 70% speed, then walk back."],"br":"Relaxed breathing.","feel":"Warm, loose and ready to run.","bad":["Rushing. These are about rhythm, not speed."],"e":"Skip the strides in week 1.","h":"Do each drill twice."},"jog":{"n":"Easy jog","lib":["A7.4#1","A2.2#2","A7.3#2"],"eq":"Path","side":"","g":"Conversational pace","set":"Running segments of your walk–run.","st":["Run at a pace where you could still talk in full sentences (about 6/10 effort). Slower than you think.","Short, quick steps (feet land under your hips, not far in front). Relaxed shoulders, arms swinging forward and back at about 90°.","Look ahead, not down at your feet.","If you can't speak in sentences, slow down or walk earlier."],"br":"Breathe through the mouth and nose, in rhythm with your steps.","feel":"Comfortable, controlled effort.","bad":["Running too fast in the first jog blocks.","Over-striding (heel landing far in front of the body)."],"e":"Walk more, jog less.","h":"Longer jog blocks."},"walk":{"n":"Brisk walk","lib":["A5.1#1","A2.2#1"],"eq":"Path","side":"","g":"Fast walk, about 110–120 steps a minute","set":"Recovery between jog or sprint blocks, and the warm-up and cool-down.","st":["Walk briskly, arms swinging, upright posture.","Use this time to bring the breathing down before the next block."],"br":"Slow, deep breaths.","feel":"Heart rate dropping but staying up.","bad":["Stopping completely."],"e":"Normal walk.","h":"Faster walk."},"stride":{"n":"Stride (fast run)","lib":["A2.3#2","A2.3#1"],"eq":"Flat path or gentle hill","side":"","g":"About 20 seconds","set":"Flat, safe 80–100 m stretch.","st":["Start at a jog and smoothly build speed over the first 5–6 seconds.","Run fast but relaxed (about 80–85% of top speed) for the rest: tall posture, quick feet, strong arm drive.","Ease down gradually over the last few metres; do not stop suddenly.","Walk back slowly to recover fully."],"br":"Fast, controlled breathing.","feel":"Fast and light, not straining.","bad":["Sprinting flat-out from a standstill in the first weeks (hamstring risk).","Tense shoulders and face."],"e":"Build to 70%.","h":"Build to 90%."},"hillsprint":{"n":"Hill sprint","lib":["A2.3#1","A2.1#6"],"eq":"Moderate hill (or flat path)","side":"","g":"12–15 seconds","set":"Find a moderate slope where you can run 50 m. No hill? Use a flat path or a staircase with long flights.","st":["Lean slightly forward from the ankles.","Drive hard up the hill at about 90% effort: knees up, arms pumping strongly, short powerful steps on the balls of the feet.","After 12–15 seconds, slow down and stop.","Walk slowly back down to the start. That is your rest."],"br":"Powerful breaths.","feel":"Glutes, hamstrings, calves. This builds sprint power and explosiveness.","bad":["Leaning from the waist instead of the ankles.","Going again before you have caught your breath."],"e":"Fast running at 75–80%.","h":"Steeper hill, or 2 more reps."},"cod":{"n":"Change-of-direction shuttle","lib":["A5.4#8","A7.4#5","A6.2#4"],"eq":"Two markers 5 m apart (shoes, trees)","side":"","g":"4 shuttles","set":"Place two markers 5 m apart on grass.","st":["Jog to the far marker, lower your hips and take 2–3 short choppy steps to slow down. Plant the foot on the opposite side to the way you're turning (turning left = plant the right foot) just past the marker.","Push off that foot to run back the other way.","Keep the knees bent and the chest over the feet when you turn. The knee should stay above the foot, not caving inward.","Week 1 at jog speed; build to fast from week 2."],"br":"Controlled.","feel":"Hips, thighs and ankles; this trains agility and braking.","bad":["Turning with a straight, stiff leg.","Knee caving inward on the plant."],"e":"Walk the turns.","h":"Faster, or 3 markers in a triangle."},"chintuck":{"n":"Chin-tuck hold","lib":["A8.3#1","A8.3#2"],"eq":"Wall or chair","side":"","g":"5 holds of 5 s","set":"Stand with your back and head against a wall (or sit tall), looking straight ahead.","st":["Without tilting the head up or down, slide your chin straight BACK, as if making a double chin. The back of the head presses gently into the wall.","You should feel the back of the neck lengthen.","Hold for 5 seconds, then relax. Repeat."],"br":"Breathe normally.","feel":"Deep muscles at the front of the neck; a stretch at the base of the skull.","bad":["Nodding the chin down to the chest.","Pushing very hard. It is a gentle, precise movement."],"e":"Lying on your back.","h":"Lying on your back: tuck the chin, then lift the head 2 cm off the floor and hold."},"pullapart":{"n":"Band pull-apart","lib":["A3.2#20","A1.1#30"],"eq":"Band","side":"","g":"15–20 reps","set":"Stand tall, holding the band in both hands, shoulder-width apart, arms straight in front at shoulder height, palms down.","st":["Pull the band apart by moving the hands out to the sides until the band touches your chest. Arms stay straight.","Squeeze the shoulder blades together and DOWN, not up.","Return slowly."],"br":"Breathe out as you pull.","feel":"Between the shoulder blades and the back of the shoulders.","bad":["Shrugging.","Arching the low back.","Bending the elbows."],"e":"Hands wider on the band.","h":"Hands closer together, or a thicker band."},"bandER":{"n":"Band external rotation at 90°","lib":["A3.2#18","A1.1#16"],"eq":"Band anchored in a door at chest height","side":"switch","g":"4–5 per arm","set":"Face the door and hold the band in your right hand. Lift the elbow to shoulder height, out to the side, with the elbow bent at 90° and the forearm pointing forward toward the anchor (like a goalpost arm, rotated forward). Step back until the band has light tension with the forearm pointing forward, level with the floor. Upper arm slightly in front of the body, not pulled behind it. Anchor on the side of the door that pulls it shut (the door opens away from you); lock it if you can.","st":["Keep the elbow exactly where it is.","Rotate the forearm up and back until it points to the ceiling.","Hold for 2 seconds, then lower slowly back to forward.","Halfway through: switch arms."],"br":"Breathe normally.","feel":"Back of the shoulder (rotator cuff).","bad":["Elbow dropping.","Arching the back to get the hand further back."],"e":"Elbow at your side, bent 90° (towel between elbow and ribs). Stand side-on with the door on your LEFT for the right arm and rotate the hand outward, away from the door.","h":"Thicker band."},"thoracic":{"n":"Thoracic extension over chair back","lib":["A3.3#7","A2.5#6"],"eq":"Chair with a firm back","side":"","g":"6–8 slow reps","set":"Sit tall in a chair with a back that comes up to about your shoulder blades. Hands behind your head, elbows forward.","st":["Keep the bottom on the seat and the ribs down.","Lean back over the top of the chair back, bending at the upper back (not the low back). Let the elbows open and lift the chest toward the ceiling.","Hold for 2 seconds, then come back up to neutral."],"br":"Breathe in as you lean back.","feel":"Mid-back (between the shoulder blades) opening up; the opposite of a desk hunch.","bad":["Pushing the head back and neck into extension.","Arching from the low back."],"e":"Smaller range.","h":"Hold 5 s each."},"pecstretch":{"n":"Doorway chest stretch","lib":["A3.1#20"],"eq":"Door frame","side":"","g":"Hold, adjust the height halfway","set":"Stand in a doorway. Put your forearms on each side of the frame, elbows at shoulder height and bent at 90°.","st":["Step one foot through the doorway and gently lean the body forward until you feel a stretch across the chest and front of the shoulders.","Keep the chin tucked and the ribs down; do not arch the back.","Halfway through: move the forearms higher (elbows just above the shoulders) for a different angle."],"br":"Slow breaths; relax further on each out-breath.","feel":"Chest and front of the shoulders.","bad":["Leaning so far it becomes painful or tingly.","Letting the head poke forward."],"e":"One arm at a time.","h":"Lean further."},"necksb":{"n":"Seated neck side-bend stretch","lib":["A3.1#18"],"eq":"Chair","side":"switch","g":"Hold each half","set":"Sit tall. Hold the edge of the seat with your right hand to keep the right shoulder down.","st":["Tilt your left ear toward your left shoulder; do not turn the head.","Optionally place the left hand on top of your head and let its weight add a very light pull.","Hold; switch sides halfway."],"br":"Slow breaths.","feel":"A gentle stretch along the side and back of the neck, down toward the shoulder.","bad":["Pulling hard with the hand.","Lifting the opposite shoulder."],"e":"No hand.","h":"Turn the nose slightly toward the armpit for the back of the neck."},"hfstretch":{"n":"Half-kneeling hip-flexor stretch","lib":["A3.1#2"],"eq":"Mat","side":"switch","g":"Hold each side","set":"Kneel on the left knee, right foot flat in front, both knees bent 90°. Pad under the knee.","st":["Squeeze the left glute and tuck the tailbone under (flatten the low back).","Gently shift the body forward until you feel a stretch at the front of the left hip.","Keep the chest tall. Hold. Switch sides halfway."],"br":"Slow breaths.","feel":"Front of the hip of the kneeling leg. Undoes long sitting.","bad":["Arching the low back.","Leaning forward instead of tucking."],"e":"Less shift.","h":"Reach the arm overhead."},"hamstretch":{"n":"Lying hamstring stretch with band","lib":["A3.1#1"],"eq":"Band or towel","side":"switch","g":"Hold each side","set":"Lie on your back. Loop the band around the sole of your right foot.","st":["Straighten the right leg and pull it up gently with the band until you feel a stretch in the back of the thigh.","Keep the other leg flat on the floor (or bent with the foot flat if that's more comfortable).","Keep the knee straight; hold. Switch sides halfway."],"br":"Slow breaths.","feel":"Back of the thigh.","bad":["Bending the knee.","Lifting the hips."],"e":"Bend the other knee.","h":"Pull closer."},"ninety":{"n":"90/90 hip stretch","lib":["A3.1#5","A3.3#6"],"eq":"Mat","side":"switch","g":"Hold each side","set":"Sit on the floor. Front leg bent 90° in front of you (shin across your body), back leg bent 90° out to the side behind you.","st":["Sit tall and lean the chest forward over the front shin, keeping the back flat.","Hold where you feel a stretch in the outer hip/glute of the front leg.","Halfway: rotate both knees to the other side and repeat."],"br":"Slow breaths.","feel":"Outer hip and glute of the front leg.","bad":["Rounding the back.","Forcing the knees if they hurt."],"e":"Hands behind you for support.","h":"Lean further forward."},"openbook":{"n":"Side-lying open book","lib":["A3.1#16","A3.2#14"],"eq":"Mat","side":"switch","g":"5–6 slow reps per side","set":"Lie on your left side, knees bent and stacked at 90° in front of you, arms straight out in front at shoulder height, palms together.","st":["Keep the knees together and on the floor.","Lift the top arm and open it like a book across your body, following the hand with your eyes, until the arm and upper back rest toward the floor on the other side.","Hold 3 seconds, breathe out, and return.","Halfway: switch sides."],"br":"Breathe out as you open.","feel":"M const dkey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => dkey(new Date());
const ck = k => st.cycle+"|"+k;
function rec(k){ return st.done[ck(k)] || {}; }
function isDone(k){ const r=rec(k); return !!(r.main||r.joker); }
function nextIdx(){ const i = DAYS.findIndex(d=>!isDone(d.k)); return i<0 ? DAYS.length-1 : i; }
function mark(k, what, sec, label){
  const id=ck(k); st.done[id]=st.done[id]||{}; st.done[id][what]=today();
  const d=today(); st.act[d]=(st.act[d]||0)+Math.round(sec/60);
  st.log.unshift({d, k, what, min:Math.round(sec/60), label}); st.log=st.log.slice(0,200); save();
}
function unmark(k, what){ const id=ck(k); if(st.done[id]){ delete st.done[id][what]; if(!Object.keys(st.done[id]).length) delete st.done[id]; } save(); }

function ring(p,size=64,stroke=7,label,col){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,p)));

  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="${stroke}"/><circle class="rp" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>${label?`<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${size/4.6}">${label}</text>`:""}</svg>`;
}

/* ---------- build a session into timed steps ---------- */
function firstEx(s){ return s.k==="run" ? s.segs[0][0] : (typeof s.items[0]==="string" ? s.items[0] : s.items[0][0]); }
function build(secs){
  const S=[];
  secs.forEach((s,si)=>{
    if(si>0) S.push({p:"move", s:TR, x:firstEx(s), lab:"Get ready · "+s.title, sec:s.title});
    if(s.k==="flow"){
      s.items.forEach(([x,t],i)=>{ if(i>0 && s.t) S.push({p:"move", s:s.t, x, lab:"Next", sec:s.title});
        S.push({p:"work", x, s:t, sec:s.title, i, n:s.items.length, flow:1}); });
    } else if(s.k==="circuit"){
      const n=s.items.length;
      for(let r=0;r<s.rounds;r++) s.items.forEach((x,i)=>{
        if(r>0 && i===0) S.push({p:"brk", s:s.brk, x, lab:`Water break · round ${r+1} of ${s.rounds} next`, sec:s.title, r, R:s.rounds});
        else if(i>0) S.push({p:"move", s:s.trans, x, lab:"Move to next", sec:s.title, r, R:s.rounds});
        S.push({p:"work", x, s:s.work, sec:s.title, r, R:s.rounds, i, n, abs:i>=n-s.nabs});
      });
    } else {
      s.segs.forEach(([x,t,lab])=>S.push({p:x==="walk"?"walk":"work", run:1, x, s:t, lab, sec:s.title}));
    }
  });
  return S;
}
const total = secs => build(secs).reduce((a,b)=>a+b.s,0);

/* ---------- Today ---------- */
let viewIdx = null;
function exLine(x, i, opts={}){
  const e=EX[x];
  return `<button class="li ${opts.abs?"abs":""}" data-ex="${x}"><span class="num">${i}</span><div class="grow"><div class="nm">${esc(e.n)}</div><div class="gd">${esc(e.g)}</div>${e.side?`<div class="sd">${SIDE[e.side]}</div>`:""}</div><span class="chev">${ic("info",20)}</span></button>`;
}
function secHTML(s){
  if(s.k==="flow"){
    return `<div class="card secbox"><div class="sechead"><div class="t">${esc(s.title)}</div><div class="small muted">${mins(s.items.reduce((a,b)=>a+b[1],0)+s.t*(s.items.length-1))} min</div></div>
    <div class="rule">${s.sub?esc(s.sub)+" · ":""}${s.t?`<b>${s.items[0][1]} s</b> each, <b>${s.t} s</b> to switch`:`<b>${s.items[0][1]} s each</b>, go straight into the next`}</div>
    ${s.items.map(([x,t],i)=>exLine(x,i+1)).join("")}</div>`;
  }
  if(s.k==="circuit"){
    const n=s.items.length;
    let h=`<div class="card secbox"><div class="sechead"><div class="t">${esc(s.title)}</div><div class="small muted">${s.rounds} rounds</div></div>
    <div class="rule">Do <b>${s.work} s</b> of each exercise → <b>${s.trans} s</b> to move to the next → … through all ${n}. After #${n}, <b>${s.brk} s water break</b>, then start again at #1. <b>${s.rounds} rounds</b> total.</div>`;
    s.items.forEach((x,i)=>{ if(i===n-s.nabs && i>0) h+=`<div class="absdiv">${ic("flame",14,2.4)} Abs finisher (still part of the circuit)</div>`; h+=exLine(x,i+1,{abs:i>=n-s.nabs}); });
    return h+`</div>`;
  }
  // run
  const rows=[]; const segs=s.segs, n=segs.length; let i=0;
  while(i<n){ const [x,t,lab]=segs[i];
    if(x!=="walk" && i+1<n && segs[i+1][0]==="walk"){
      const wk=segs[i+1][1]; let cnt=0, j=i;
      while(j<n && segs[j][0]===x && segs[j][1]===t){ cnt++; if(j+2<n && segs[j+1][0]==="walk" && segs[j+1][1]===wk && segs[j+2][0]===x && segs[j+2][1]===t) j+=2; else { j+=1; break; } }
      if(cnt>1){ rows.push([`<b>${cnt} ×</b> ${esc(EX[x].n)} ${fmt(t)} + ${segs[i+1][2].startsWith("Walk back")?"walk back":"walk"} ${fmt(wk)}`, cnt*t+(cnt-1)*wk, x]); i=j; continue; }
    }
    rows.push([`${esc(lab)}`, t, x]); i++; }
  return `<div class="card secbox"><div class="sechead"><div class="t">${esc(s.title)}</div><div class="small muted">${mins(segs.reduce((a,b)=>a+b[1],0))} min</div></div>
  <div class="rule">${esc(s.sub)}. The player beeps and tells you when to jog and when to walk.</div>
  <div class="seq" style="margin-top:8px">${rows.map(([t,sec,x])=>`<div class="s ${x!=="walk"?"run":""}" data-ex="${x}"><span>${t}</span><span class="muted">${fmt(sec)}</span></div>`).join("")}</div></div>`;
}
function renderToday(){
  const ni=nextIdx(); const i=viewIdx ?? ni; const d=DAYS[i]; const r=rec(d.k); const done=isDone(d.k);
  let h=`<div class="eyebrow">Cycle ${st.cycle} · Week ${d.w} of 4 · Day ${i+1} of 28</div>
  <h1>${DOW[d.d]}</h1><div class="muted">${esc(d.t)}</div>
  <div class="chips"><span class="pill accent">${ic("clock",14,2.4)} ${mins(d.sec)} min</span><span class="pill">${ic("pin",14,2.4)} ${esc(d.where)}</span><span class="pill">${esc(DATA.weeknote[d.w].split(" · ")[0])} week</span></div>`;

  h+=`<div style="margin-top:14px"><button class="btn ${done?"ghost":"primary"}" id="start">${ic("play",18)} ${done?"Do it again":"Start · guided"}</button></div>
  <div class="note">${ic("tool",14,2.2)} <b>Setup:</b> ${esc(d.setup)}<br><span style="display:block;margin-top:6px">${d.type==="run"?"Abs circuit: "+esc(DATA.weeknote[d.w].split(" · ").slice(1).join(" · ")):esc(DATA.weeknote[d.w])}. ${esc(d.absnote)}</span></div>
  ${d.secs.map(secHTML).join("")}
  <div class="row" style="margin-top:10px;gap:8px"><button class="mini-btn ${done&&r.main?"done":"ghost"}" id="manual">${ic("check",16,2.6)} ${r.main?"Done (tap to undo)":"I did it without the player"}</button></div>
  <button class="jcard" id="joker"><span class="badge big">${ic("joker",26)}</span><div class="grow"><div class="t">No time or motivation?</div><div class="s">Do the Joker instead: ${mins(JOKER.sec)} min, full body, no equipment. It counts as today's session.</div></div>${ic("chev",20)}</button>
  <h2>Optional extras</h2>`;
  Object.entries(EXTRAS).forEach(([b,e])=>{ const on=!!r[b];
    h+=`<div class="card optc"><div class="row"><span class="badge ${on?"g":""}">${ic(on?"check":e.icon,20)}</span><div class="grow"><div style="font-weight:750">${esc(e.t)}</div><div class="small muted">${esc(e.sub)} · ${mins(e.sec)} min</div></div><button class="mini-btn" data-ext="${b}">${ic("play",14)} Start</button></div>

    <button class="linkbtn" data-tickext="${b}" style="margin-top:8px">${on?"Undo done":"Mark as done"}</button></div>`; });
  $("#v-today").innerHTML=h;
  $("#start").onclick=()=>openPlayer({title:`${DOW[d.d]} · ${d.t}`, secs:d.secs, k:d.k, what:"main"});

  if($("#gonext")) $("#gonext").onclick=()=>{ viewIdx=null; renderToday(); window.scrollTo(0,0); };

  bindEx($("#v-today"));

(function(){ const sh=document.getElementById("sheet"); let y0=null, dy=0;
