  sh.addEventListener("touchmove",e=>{ if(y0===null) return; dy=e.touches[0].clientY-y0; if(dy>0){ sh.style.transform=`translateY(${dy}px)`; if(e.cancelable) e.preventDefault(); } else { sh.style.transform=""; } },{passive:false});
  sh.addEventListener("touchend",()=>{ if(y0===null) return; sh.style.transition=""; sh.style.transform=""; if(dy>90) history.back(); y0=null; dy=0; });
})();
function closeSheet(){ $("#sheet").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#scrim").onclick=()=>history.back();
window.addEventListener("popstate",()=>{
  if($("#sheet").classList.contains("open")){ closeSheet(); return; }
  if(P.open){ closePlayer(true); }
});

/* ---------- Audio / voice / wake lock ---------- */
let actx=null, wl=null;
function audioInit(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){} }
function tone(f=880, dur=.15, t=0, vol=.28){ try{ if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.connect(g); g.connect(actx.destination); const s=actx.currentTime+t; g.gain.setValueAtTime(vol,s); g.gain.exponentialRampToValueAtTime(.001,s+dur); o.start(s); o.stop(s+dur+.02); }catch(e){} }
function say(t){ if(!st.voice) return; try{ const u=new SpeechSynthesisUtterance(t); u.rate=1.05; u.lang="en-US"; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
async function keepAwake(on){ try{ if(on && "wakeLock" in navigator){ wl = await navigator.wakeLock.request("screen"); } else if(!on && wl){ await wl.release(); wl=null; } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && P.open){ keepAwake(true); P.catchup(); } });

/* ---------- Player ---------- */
const P = {open:false, steps:[], idx:0, endAt:0, left:0, paused:true, started:false, int:null, cfg:null, cues:{}, finished:false,
  catchup(){ if(this.paused||!this.started) return; while(Date.now()>=this.endAt && this.idx<this.steps.length){ this.advance(true); } }
};
function openPlayer(cfg){
  P.cfg=cfg; P.steps=build(cfg.secs); P.idx=0; P.paused=true; P.started=false; P.finished=false; P.cues={};
  P.left=P.steps[0].s; P.open=true;
  $("#player").classList.add("open"); history.pushState({pl:1},""); keepAwake(true);
  renderPlayer();
}
function closePlayer(fromPop){
  clearInterval(P.int); P.open=false; $("#player").classList.remove("open"); keepAwake(false); try{ speechSynthesis.cancel(); }catch(e){}
  if(!fromPop) history.back(); renderAll();
}
const remaining = () => P.steps.slice(P.idx+1).reduce((a,b)=>a+b.s,0) + P.left;
const totalS = () => P.steps.reduce((a,b)=>a+b.s,0);
function phaseInfo(s){
  if(s.p==="move") return ["move", s.lab||"Move to next"];
  if(s.p==="brk") return ["brk", "Water break"];
  if(s.p==="walk") return ["walk", s.lab||"Walk"];
  if(s.run) return ["", s.lab||"Run"];
  return ["", s.flow ? s.sec : (s.abs ? "Abs · work" : "Work")];
}
function stepCount(s){
  if(s.run || s.p==="walk") return s.sec;
  if(s.R) return `Round ${s.r+1} of ${s.R} · Exercise ${(s.i??0)+1} of ${s.n??"–"}`;
  if(s.n) return `${s.sec} · ${s.i+1} of ${s.n}`;
  return s.sec||"";
}
function nextWork(from){ for(let j=from;j<P.steps.length;j++){ if(P.steps[j].p==="work") return P.steps[j]; } return null; }
function renderPlayer(){
  const el=$("#player");
  if(P.finished){
    const T=totalS();
    el.innerHTML=`<div class="pmain"><div class="pdone">${ring(1,120,12,"✓")}<h2>Done!</h2><div class="muted">${esc(P.cfg.title)} · ${mins(T)} min</div><div style="margin-top:22px"><button class="btn done" id="pfin">Save & close</button></div><div style="margin-top:10px"><button class="btn ghost" id="pnos">Close without saving</button></div></div></div>`;
    $("#pfin").onclick=()=>{ mark(P.cfg.k,P.cfg.what,T,P.cfg.title); toast("Saved. Great work!"); closePlayer(); };
    $("#pnos").onclick=()=>closePlayer();
    return;
  }
  const s=P.steps[P.idx]; const e=EX[s.x]; const [pc,pl]=phaseInfo(s);
  const isWork = s.p==="work";
  const nxtW = isWork ? nextWork(P.idx+1) : null;
  const showEx = e; // during move/brk, x is the upcoming exercise
  const frac = s.s ? P.left/s.s : 0;
  const col = pc==="move" ? "var(--move)" : pc==="brk" ? "var(--brk)" : pc==="walk" ? "var(--done)" : "var(--accent)";
  const pre = !P.started;
  el.innerHTML=`<div class="ptop"><div class="row"><button class="pclose" id="px" aria-label="Close">${ic("x",20,2.4)}</button><div class="grow"><div class="ptitle">${esc(P.cfg.title)}</div><div class="pmeta">${fmt(remaining())} left of ${fmt(totalS())}</div></div><button class="pclose" id="pvoice" aria-label="Voice">${ic(st.voice?"vol":"mute",20)}</button></div><div class="pbar"><i style="width:${(1-remaining()/totalS())*100}%"></i></div></div>
  <div class="pmain">
    ${pre?`<div class="note" style="margin:6px 0 10px">${P.cfg.intro?esc(P.cfg.intro)+"<br><br>":""}Tap <b>play</b> to start. The screen stays on; the app beeps 3-2-1 before each change${st.voice?" and says the next move out loud":""}. Tap the exercise name any time for the full how-to.</div>`:""}
    <span class="phase ${pc}">${esc(pl)}</span>
    <button class="pname" id="pname">${esc(showEx.n)} <span class="i">${ic("info",22)}</span></button>
    <div class="pguide">${s.p==="move"||s.p==="brk"?"Up next · ":""}${esc(showEx.g)}</div>
    ${e.side && !s.run?`<span class="pside">${SIDE[e.side]}</span>`:""}
    <div class="pclock">${ring(frac,200,13,"",col)}<div class="big"><b id="pt">${fmt(P.left)}</b><span>${esc(stepCount(s))}</span></div></div>
    ${isWork && nxtW ? `<div class="pnext"><div class="grow"><div class="l">Next</div><div class="n">${esc(EX[nxtW.x].n)}</div></div><span class="muted small">${nxtW.run?fmt(nxtW.s):"after "+TR+" s"}</span></div>`:""}
    ${isWork && !nxtW ? `<div class="pnext"><div class="grow"><div class="l">Next</div><div class="n">Finish 🎉</div></div></div>`:""}
    <div class="pcues"><div class="lab">${s.p==="work"?"How":"Get set up"}</div>${s.p!=="work"?`<div style="margin-top:4px">${esc(e.set)}</div>`:""}<ol>${e.st.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>
  </div>
  <div class="pctl"><button class="snd" id="pprev" aria-label="Previous">${ic("prev",22)}</button><button class="pp" id="pp" aria-label="Play or pause">${ic(P.paused?"play":"pause",30)}</button><button class="snd" id="pnext" aria-label="Skip">${ic("next",22)}</button></div>`;
  $("#px").onclick=()=>{ if(P.started && !confirm("Stop this workout? Progress in this session won't be saved.")) return; closePlayer(); };
  $("#pvoice").onclick=()=>{ st.voice=!st.voice; save(); renderPlayer(); };
  $("#pname").onclick=()=>openSheet(s.x);
  $("#pp").onclick=togglePlay;
  $("#pnext").onclick=()=>{ P.cues={}; advance(); };
  $("#pprev").onclick=()=>{ P.cues={}; if(P.steps[P.idx].s-P.left>3 || P.idx===0){ P.left=P.steps[P.idx].s; } else { P.idx--; P.left=P.steps[P.idx].s; } P.endAt=Date.now()+P.left*1000; renderPlayer(); };
}
function announce(s){
  const e=EX[s.x];
  if(s.p==="move") say((s.lab&&s.lab.startsWith("Get ready")?"Get ready. ":"Next: ")+e.n);
  else if(s.p==="brk") say(`Water break. Round ${s.r+1} next. First up: ${e.n}`);
  else if(s.p==="walk") say(s.lab && s.lab.startsWith("Walk back") ? "Walk back and recover" : (s.lab||"Walk"));
  else if(s.run) say(`${s.lab}. ${mins(s.s)>=1?mins(s.s)+" minutes":s.s+" seconds"}`);
  else say(e.n+". Go!");
}
function togglePlay(){
  audioInit();
  if(P.paused){ P.paused=false; if(!P.started){ P.started=true; announce(P.steps[0]); tone(1100,.35); } P.endAt=Date.now()+P.left*1000; clearInterval(P.int); P.int=setInterval(loop,200); }
  else { P.paused=true; P.left=Math.max(0,(P.endAt-Date.now())/1000); clearInterval(P.int); try{ speechSynthesis.cancel(); }catch(e){} }
  haptic(10); renderPlayer();
}
function advance(silent){
  P.idx++; P.cues={};
  if(P.idx>=P.steps.length){ clearInterval(P.int); P.finished=true; tone(880,.2); tone(1100,.2,.22); tone(1320,.45,.44); haptic([200,100,200]); say("Workout complete. Well done!"); renderPlayer(); return; }
  const s=P.steps[P.idx]; P.left=s.s; P.endAt=(silent?P.endAt:Date.now())+s.s*1000;
  if(!silent){ s.p==="work" ? tone(1100,.35) : tone(660,.3); haptic(s.p==="work"?[80,60,80]:60); announce(s); }
  renderPlayer();
}
P.advance = advance;
function loop(){
  if(P.paused) return;
  const left=(P.endAt-Date.now())/1000; P.left=Math.max(0,left);
  const s=P.steps[P.idx]; const e=EX[s.x];
  const t=$("#pt"); if(t) t.textContent=fmt(P.left);
  const rp=document.querySelector(".pclock .rp"); if(rp){ const c=+rp.getAttribute("stroke-dasharray"); rp.setAttribute("stroke-dashoffset", c*(1-P.left/s.s)); }
  const bar=document.querySelector(".pbar i"); if(bar) bar.style.width=(1-remaining()/totalS())*100+"%";
  const meta=document.querySelector(".pmeta"); if(meta) meta.textContent=`${fmt(remaining())} left of ${fmt(totalS())}`;
  const sec=Math.ceil(left);
  if(sec<=3 && sec>=1 && !P.cues["c"+sec]){ P.cues["c"+sec]=1; tone(880,.12); }
  if(s.p==="work" && e.side==="switch" && !s.run && left<=s.s/2 && !P.cues.sw){ P.cues.sw=1; tone(990,.12); tone(990,.12,.18); haptic([60,40,60]); say("Switch sides"); }
  if(s.run && s.s>=120 && left<=60 && left>57 && !P.cues.m1){ P.cues.m1=1; say("One minute left"); }
  if(left<=0) advance();
}

/* ---------- Plan ---------- */
function renderPlan(){
  const ni=nextIdx(); const sel=viewIdx ?? ni;
  let h=`<div class="eyebrow">Cycle ${st.cycle}</div><h1>Plan</h1><div class="muted">28 days, in order. Skip whenever you need to; tap a day to open it.</div>`;
  [1,2,3,4].forEach(w=>{
    const days=DAYS.map((d,i)=>({d,i})).filter(x=>x.d.w===w);
    const nd=days.filter(x=>isDone(x.d.k)).length;
    h+=`<div class="card wk"><div class="wkhead"><div style="font-weight:800;font-size:17px">Week ${w} <span class="small muted" style="font-weight:600">· ${esc(DATA.weeknote[w].split(" · ")[0])}</span></div><div class="small muted">${nd}/7</div></div><div class="grid7">`;
    days.forEach(({d,i})=>{ const r=rec(d.k); const done=isDone(d.k); const jok=r.joker&&!r.main; const isSel=i===sel; const next=i===ni&&!done&&!isSel;
      h+=`<button class="dt ${done?(jok?"jok":"done"):""} ${isSel?"sel":""} ${next?"nextdot":""}" data-day="${i}" aria-label="Week ${w} ${DOW[d.d]}"><span>${d.d.slice(0,2)}</span><span class="ic">${ic(done?(jok?"joker":"check"):d.icon,20,2.2)}</span><span style="font-size:10px;font-weight:650">${mins(d.sec)}′</span></button>`; });
    h+=`</div></div>`;
  });
  h+=`<div class="legend"><span><i class="sw" style="background:var(--done)"></i>Done</span><span><i class="sw" style="background:var(--joker)"></i>Joker done</span><span><i class="sw" style="outline:2px solid var(--accent);background:var(--accent-soft)"></i>Selected</span><span><i class="sw" style="width:8px;height:8px;border-radius:50%;background:var(--accent)"></i>Up next</span></div>`;
  h+=`<h2>Your week</h2><div class="card">${[["legs","Mon","Legs & glutes + abs","Home circuit, 20–25 min"],["route","Tue","Easy run + abs on the grass","Walk–run, builds to longer jogs"],["arms","Wed","Upper body & posture + abs","Home circuit, 20–25 min"],["bolt","Thu","Speed & agility run + abs","Strides, hill sprints, shuttles"],["bolt","Fri","Legs, balance & agility + abs","Home circuit, 20–25 min"],["route","Sat","Long run + abs","Longest walk–run of the week"],["flame","Sun","Full-body burn + abs","Home circuit, 20–25 min"]].map(([i,dd,t,s])=>`<div class="row" style="padding:7px 0"><span class="badge">${ic(i,20)}</span><div class="grow"><div style="font-weight:650">${dd} · ${t}</div><div class="small muted">${s}</div></div></div>`).join("")}</div>
  <h2>How the 4 weeks build</h2><div class="card small">${[1,2,3,4].map(w=>`<div style="padding:5px 0"><b>Week ${w}:</b> ${esc(DATA.weeknote[w])}</div>`).join("")}<div style="padding:5px 0" class="muted">After week 4, start a new cycle (Progress tab) and use the “Harder” version of any exercise that felt easy.</div></div>
  <h2>All exercises</h2><div class="card">${Object.keys(EX).filter(x=>!["walk","jog"].includes(x)).sort((a,b)=>EX[a].n.localeCompare(EX[b].n)).map(x=>`<button class="li" data-ex="${x}"><div class="grow"><div class="nm">${esc(EX[x].n)}</div><div class="gd">${esc(EX[x].eq)}</div></div><span class="chev">${ic("chev",18)}</span></button>`).join("")}</div>`;
  $("#v-plan").innerHTML=h;
  document.querySelectorAll("[data-day]").forEach(el=>el.onclick=()=>{ viewIdx=+el.dataset.day; switchTab("today"); });
  bindEx($("#v-plan"));
}

/* ---------- Progress ---------- */
function streak(){ const has=d=>(st.act[d]||0)>0; const dt=new Date(); let n=0; if(!has(dkey(dt))) dt.setDate(dt.getDate()-1); while(has(dkey(dt))){ n++; dt.setDate(dt.getDate()-1); } return n; }
function newCycle(){ st.cycles.push({n:st.cycle, end:today(), days:DAYS.filter(d=>isDone(d.k)).length}); st.cycle++; viewIdx=null; save(); renderAll(); toast(`Cycle ${st.cycle} started`); }
function renderProgress(){
  const cyc=DAYS.filter(d=>isDone(d.k)).length;
  const last7=(()=>{ let c=0; const d=new Date(); for(let i=0;i<7;i++){ if(st.act[dkey(d)]) c++; d.setDate(d.getDate()-1);} return c; })();
  const totMin=Object.values(st.act).reduce((a,b)=>a+b,0);
  const cnt=w=>st.log.filter(l=>l.what===w).length;
  let h=`<div class="eyebrow">Cycle ${st.cycle}</div><h1>Progress</h1>
  <div class="card" style="margin-top:14px"><div class="hero">${ring(cyc/28,108,11,`${Math.round(cyc/28*100)}%`)}<div class="grow"><div style="font-weight:800;font-size:20px">${cyc} of 28 days</div><div class="muted small">this cycle${st.cycles.length?` · ${st.cycles.length} cycle${st.cycles.length>1?"s":""} finished before`:""}</div></div></div></div>
  <div class="tiles"><div class="tile"><div class="v">${streak()}</div><div class="l">Day streak</div></div><div class="tile"><div class="v">${last7}<span class="muted" style="font-size:16px">/7</span></div><div class="l">Active days, last 7</div></div><div class="tile"><div class="v">${totMin}</div><div class="l">Minutes trained</div></div><div class="tile"><div class="v">${cnt("main")}<span class="muted" style="font-size:16px"> + ${cnt("joker")}</span></div><div class="l">Sessions + Joker days</div></div></div>`;
  const end=new Date(); const dow=(end.getDay()+6)%7; const start=new Date(end); start.setDate(end.getDate()-dow-7*15);
  let cells=""; const d=new Date(start);
  for(let i=0;i<16*7;i++){ const k=dkey(d); const v=st.act[k]||0; const lv=v===0?0:v<10?1:v<20?2:v<35?3:4; const fut=d>end;
    cells+=`<i title="${k}: ${v} min" style="background:var(--heat${lv});${fut?"opacity:.3":""}"></i>`; d.setDate(d.getDate()+1); }
  h+=`<h2>Activity</h2><div class="card"><div class="heat">${cells}</div><div class="legend" style="margin-top:10px"><span>Less</span>${[0,1,2,3,4].map(l=>`<i class="sw" style="background:var(--heat${l})"></i>`).join("")}<span>More minutes</span></div></div>`;
  if(st.log.length){ h+=`<h2>Recent</h2><div class="card">${st.log.slice(0,8).map(l=>`<div class="recent"><span class="badge ${l.what==="joker"?"":"g"}" ${l.what==="joker"?'style="background:var(--joker-soft);color:var(--joker)"':""}>${ic(l.what==="joker"?"joker":l.what==="M"?"neck":l.what==="E"?"moon":"check",18,2.4)}</span><div class="grow"><div style="font-weight:650">${esc(l.label||"")}</div><div class="small muted">${l.min} min</div></div><div class="small muted">${new Date(l.d+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})}</div></div>`).join("")}</div>`; }
  h+=`<div style="margin-top:26px;display:grid;gap:10px"><button class="btn ghost" id="pnew">Start a new cycle</button><button class="danger" id="preset" style="padding:10px">Reset all data on this phone</button></div>
  <p class="small muted" style="text-align:center;margin-top:14px">Progress is saved in this browser only.</p>`;
  $("#v-progress").innerHTML=h;
  $("#pnew").onclick=()=>{ if(confirm(`Finish cycle ${st.cycle} and start cycle ${st.cycle+1}? Days start fresh; history stays.`)) newCycle(); };
  $("#preset").onclick=()=>{ if(confirm("Delete all progress saved on this phone?")){ st=fresh(); save(); viewIdx=null; renderAll(); } };
}

/* ---------- tabs ---------- */
let tab="today";
function switchTab(t){ tab=t; document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+t)); renderAll(); window.scrollTo(0,0); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function renderAll(){ if(tab==="today") renderToday(); if(tab==="plan") renderPlan(); if(tab==="progress") renderProgress(); }
renderAll();
</script>
</body>
