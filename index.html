<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Ex">
<title>Life Exercises</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff6a3d'/%3E%3Cpath d='M18 34l9 9 19-21' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f3; --text:#14161a; --muted:#6b7280; --line:#e3e6ea;
  --accent:#ff6a3d; --accent-ink:#ffffff; --accent-soft:#ffe8df; --done:#1fae5b; --done-soft:#dcf5e6;
  --warn:#d97706; --ring-track:#e6e8ec; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.06);
  --heat0:#e9ecef; --heat1:#ffd3c2; --heat2:#ffab8b; --heat3:#ff8456; --heat4:#ff6a3d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --surface:#181b21; --surface2:#20242c; --text:#f2f3f5; --muted:#9aa2ae; --line:#2a2f38;
    --accent:#ff7a4f; --accent-ink:#1a0d07; --accent-soft:#3a2219; --done:#34d27b; --done-soft:#143524;
    --ring-track:#2a2f38; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --heat0:#20242c; --heat1:#4a2a1f; --heat2:#7a3a24; --heat3:#c4552d; --heat4:#ff7a4f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 160px)}
h1{font-size:30px;line-height:1.1;margin:4px 0 2px;letter-spacing:-.02em;font-weight:800}
h2{font-size:19px;margin:22px 0 10px;letter-spacing:-.01em;font-weight:750}
.eyebrow{font-size:13px;font-weight:650;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--done-soft);color:var(--done)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font-weight:700;font-size:16px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.done{background:var(--done);color:#fff}
.btn:active{transform:scale(.98)}
.progressbar{height:8px;border-radius:99px;background:var(--ring-track);overflow:hidden}
.progressbar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
/* session cards on Today */
.scard{display:flex;gap:14px;align-items:center;padding:16px;margin-top:12px}
.scard .title{font-weight:750;font-size:17px}
.scard .meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.ring{flex:none}
.ring text{font-weight:800;fill:var(--text)}
.chev{color:var(--muted);flex:none}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);margin-top:8px;box-shadow:var(--shadow)}
.opt .t{font-weight:650}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.badge.big{width:52px;height:52px;border-radius:16px}
.badge.g{background:var(--done-soft);color:var(--done)}
.banner{margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--done-soft);color:var(--done);font-weight:650;display:flex;gap:10px;align-items:center}
.linkbtn{color:var(--accent);font-weight:650;font-size:14px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px)}
.tabbar .in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:650;color:var(--muted)}
.tab.on{color:var(--accent)}
/* plan grid */
.wk{margin-top:12px;padding:14px}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dt{aspect-ratio:.78;border-radius:14px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 2px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.dt .ic{color:var(--text);opacity:.85}
.dt.done{background:var(--done);color:#fff}
.dt.done .ic{color:#fff;opacity:1}
.dt.next{outline:2.5px solid var(--accent);outline-offset:-2.5px;background:var(--accent-soft);color:var(--accent)}
.dt.next .ic{color:var(--accent)}
.dt .mini{width:100%;height:4px;border-radius:9px;background:var(--ring-track);overflow:hidden;margin:0 5px;max-width:30px}
.dt .mini i{display:block;height:100%;background:var(--accent)}
.dt.done .mini{display:none}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
/* session overlay */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.overlay.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.ohead{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;border-bottom:1px solid var(--line)}
.ohead .in{max-width:560px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:650;height:36px}
.obody{max-width:560px;margin:0 auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 120px)}
.ex{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:18px;padding:14px;margin-top:10px;box-shadow:var(--shadow);transition:opacity .2s}
.ex.on{opacity:.62}
.ex.on .exname{text-decoration:line-through;text-decoration-thickness:1.5px}
.chk{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex:none;margin-top:2px;transition:all .15s;color:transparent}
.ex.on .chk{background:var(--done);border-color:var(--done);color:#fff}
.chk:active{transform:scale(.9)}
.exbody{flex:1;min-width:0}
.exname{font-weight:700;font-size:16px}
.exdose{font-weight:750;font-size:15px;margin-top:3px;color:var(--accent)}
.exload{font-size:13.5px;color:var(--muted);margin-top:2px}
.ids{font-size:11.5px;color:var(--muted);margin-top:6px;letter-spacing:.01em}
.sub{font-size:11px;font-weight:700;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
.info{flex:none;color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--surface2);margin-top:3px}
.note{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-top:10px}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:3}
.sticky-cta .in{max-width:560px;margin:0 auto}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;padding:10px 18px calc(env(safe-area-inset-bottom) + 24px)}
.sheet.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:21px;margin:0 0 6px;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin-top:14px;font-size:14.5px}
.kv b{color:var(--muted);font-weight:650;font-size:13px;padding-top:1px}
.steps{margin:6px 0 0;padding-left:20px}
.steps li{margin:4px 0}
.sec{margin-top:16px}
.sec .lab{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:14px;padding:10px 12px;font-size:14.5px}
.timers{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tchip{height:40px;padding:0 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.ez{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ez div{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:14px}
.ez .lab{margin-bottom:2px}
/* timer pill */
.timer{position:fixed;left:50%;transform:translate(-50%,160%);bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:50;background:var(--text);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .25s,opacity .2s;min-width:250px;opacity:0;pointer-events:none}
.timer.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.timer .tt{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;letter-spacing:.02em}
.timer .tl{font-size:12px;opacity:.7;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:800;font-size:13px}
.timer.end{background:var(--done)}
/* progress */
.hero{display:flex;gap:18px;align-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.tile .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile .l{font-size:13px;color:var(--muted);margin-top:2px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:15px;height:15px;border-radius:4px;background:var(--heat0);display:block}
.bars .b{display:grid;grid-template-columns:118px 1fr 40px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
.bars .b .progressbar{height:10px}
.bars .b .pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.recent{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.recent:last-child{border-bottom:0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-150%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:650;font-size:14px;z-index:60;transition:transform .25s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.danger{color:#e5484d;font-weight:650;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <section id="v-today" class="view on"></section>
  <section id="v-plan" class="view"></section>
  <section id="v-progress" class="view"></section>
</div>

<nav class="tabbar"><div class="in">
  <button class="tab on" data-tab="today"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>Today</button>
  <button class="tab" data-tab="plan"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
  <button class="tab" data-tab="progress"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
</div></nav>

<div class="overlay" id="session"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="timer" id="timer"><div class="grow"><div class="tl" id="tlab">Rest</div><div class="tt" id="tval">0:00</div></div><button id="tplus">+15</button><button id="tstop" aria-label="Stop timer">✕</button></div>
<div class="toast" id="toast"></div>

p forward for distance, resetting between hops.","bad":"hopping softly to stay comfortable — long, cushioned contacts drop the load below what one leg can take.","ev":"Moderate support","gate":"Impact — build up from low impact. Falls — support within reach; hand on the rail on stairs.","sub":false,"min":3,"dom":"A1"},"A1.1#30":{"n":"Prone Y raise","ids":["A1.1 #30"],"dose":"2 × 10–12","rest":"45 s","load":"Prone on the floor, thumbs up, light bottles (0.5 L)","e":"No load / wall slide to Y","h":"1.5 L bottles","how":"Turn the thumbs up and raise both arms forward and out into a Y, diagonally overhead in line with the lower trapezius; Draw the shoulder blades down and back as the arms rise, keeping the neck long and the chin tucked.","bad":"shrugging the shoulders toward the ears, which hands the lift to the upper trapezius.","ev":"Limited or mixed evidence","gate":"","sub":false,"min":2,"dom":"A1"},"A5.3#8":{"n":"Kerb step-down practice","ids":["A5.3 #8"],"dose":"Every kerb","rest":"45 s","load":"Kerb step-downs without looking down","e":"Look","h":"Eyes up","how":"Step down leading with one leg, lowering under control rather than dropping; Keep a light touch on the support.","bad":"gripping the support hard.","ev":"Limited or mixed evidence","gate":"Falls — support within reach; hand on the rail on stairs.","sub":false,"min":0,"dom":"A5"},"A1.2#4":{"n":"Backpack swing","ids":["A1.2 #4"],"dose":"3 × 10","rest":"60 s","load":"Backpack swung by the handle loop, or heavy band hinge snap","e":"Hip-hinge drill without load","h":"Heavier pack","how":"Hike it back between the legs, brushing high against the inner thighs; Snap the hips forward hard and stand tall, letting the pack float to chest height.","bad":"squatting the bell up instead of hinging, which turns a hip-extension throw into a shallow front raise.","ev":"Moderate support","gate":"","sub":false,"min":3,"dom":"A1"},"A8.1#18":{"n":"Pegboard and in-hand manipulation","ids":["A8.1 #18"],"dose":"2 min","rest":"30 function load(){ try{ st = JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ st = null; }
  if(!st) st = {cycle:1, ticks:{}, done:{}, act:{}, cycles:[]}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const tk = (dk,b,u) => `${st.cycle}|${dk}|${b}|${u}`;
const isTicked = (dk,b,u) => !!st.ticks[tk(dk,b,u)];
const isDone = dk => !!st.done[`${st.cycle}|${dk}`];
function blockCount(day,b){ const l=day.b[b]||[]; return [l.filter(u=>isTicked(day.k,b,u)).length, l.length]; }
function coreCount(day){ let a=0,t=0; ["main","M"].forEach(b=>{ if(day.b[b]){ const [x,y]=blockCount(day,b); a+=x; t+=y; } }); return [a,t]; }
function nextIdx(){ const i = DAYS.findIndex(d=>!isDone(d.k)); return i<0 ? DAYS.length-1 : i; }
function bump(n){ const d=today(); st.act[d]=Math.max(0,(st.act[d]||0)+n); if(!st.act[d]) delete st.act[d]; }

function ring(p,size=64,stroke=7,label){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.min(1,p));
  const col = p>=1 ? "var(--done)" : "var(--accent)";
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .5s"/>${label?`<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${size/4.6}">${label}</text>`:""}</svg>`;

  walk:'<circle cx="13" cy="4" r="2"/><path d="M10 22l2-7 3 3v6M8 12l3-4 4 1 2 4M12 8l-1 5"/>',
  cup:'<path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6zM17 9h2a2 2 0 0 1 0 4h-2M8 2v3M12 2v3"/>',
  moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 4a3 3 0 0 1 0 6M21 20c0-2-1-4-4-5"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
  pin:'<path d="M12 22s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
  back:'<path d="M15 6l-6 6 6 6"/>'
};
const ic = (n,s=22,w=2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const BICON = {main:null, M:"clock", W:"walk", S:"cup", E:"moon", K:"users"};
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2200); }
function haptic(p=12){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* ---------- Today ---------- */
let viewIdx = null; // day selected from Plan (null = next up)
function renderToday(){
  const i = viewIdx ?? nextIdx(); const day = DAYS[i];
  const [ca,ct] = coreCount(day); const done = isDone(day.k);
  const cycDone = DAYS.filter(d=>isDone(d.k)).length;
  const allDone = cycDone===DAYS.length;
  let h = `<div class="row" style="justify-content:space-between"><div class="eyebrow">${viewIdx!==null && viewIdx!==nextIdx() ? "Viewing" : "Up next"} · Day ${i+1} of 21</div>${viewIdx!==null && viewIdx!==nextIdx()?`<button class="linkbtn" id="toNext">Go to next up</button>`:`<span class="pill">Cycle ${st.cycle}</span>`}</div>
  <h1>Week ${day.w} · ${DOW[day.d]}</h1>
  <div class="muted">${esc(day.t)} · ${esc(day.where)}</div>
  <div class="progressbar" style="margin-top:14px"><i style="width:${cycDone/DAYS.length*100}%"></i></div>
  <div class="small muted" style="margin-top:6px">${cycDone} of 21 days done this cycle</div>`;
  if(allDone && viewIdx===null){
    h += `<div class="card" style="margin-top:16px;text-align:center"><div class="badge big g" style="margin:0 auto 10px">${ic("check",28,2.6)}</div><h2 style="margin:4px 0">Cycle ${st.cycle} complete</h2><p class="muted">All 21 days done. Start the next cycle and move each exercise one step forward.</p><button class="btn primary" id="newCycle">Start cycle ${st.cycle+1}</button></div>`;
    $("#v-today").innerHTML = h; $("#newCycle").onclick=newCycle; return;
  }
  if(done) h += `<div class="banner">${ic("check",22,2.6)}<div class="grow">Day complete. Nice work.</div><button class="linkbtn" id="undoDay" style="color:inherit">Undo</button></div>`;
  ["main","M"].forEach(b=>{
    if(!day.b[b]) return;
    const [a,t]=blockCount(day,b); const p=t?a/t:0;
    const mins = b==="main" ? day.min : day.b[b].reduce((s,u)=>s+(EX[u].min||1),0);
    h += `<button class="card scard" data-open="${b}" style="width:100%;text-align:left">${ring(p,62,7,`${a}/${t}`)}
      <div class="grow"><div class="small" style="color:var(--accent);font-weight:700">${BLOCKS[b].s}</div><div class="title">${b==="main"?esc(day.t):BLOCKS[b].t}</div>
      <div class="meta">${t} exercises · ~${mins} min${b==="main"?" · "+esc(day.where):""}</div></div><span class="chev">${ic("chev")}</span></button>`;
  });
  const opts = ["W","S","E","K"].filter(b=>day.b[b]);
  if(opts.length){
    h += `<h2>Optional extras</h2>`;
    opts.forEach(b=>{ const [a,t]=blockCount(day,b);
      h += `<button class="opt" data-open="${b}" style="width:100%;text-align:left"><span class="badge ${a===t&&t?"g":""}">${ic(a===t&&t?"check":BICON[b],20)}</span><div class="grow"><div class="t">${BLOCKS[b].t}</div><div class="small muted">${BLOCKS[b].s.replace("Optional · ","")} · ${a}/${t} done</div></div><span class="chev">${ic("chev",18)}</span></button>`; });
  }
  h += `<div style="margin-top:22px">${done?`<button class="btn ghost" id="openPlan">See the plan</button>`:`<button class="btn ${ca===ct&&ct?"done":"primary"}" id="complete">${ic("check",20,2.6)} Mark day complete</button><div class="small muted" style="text-align:center;margin-top:8px">${ca===ct&&ct?"Main session and 11:00 block are done.":"Tick what you did, then mark the day complete."}</div>`}</div>`;
  $("#v-today").innerHTML = h;
  document.querySelectorAll("#v-today [data-open]").forEach(el=>el.onclick=()=>openSession(i, el.dataset.open));
  $("#complete") && ($("#complete").onclick=()=>completeDay(i));
  $("#undoDay") && ($("#undoDay").onclick=()=>{ delete st.done[`${st.cycle}|${day.k}`]; save(); renderAll(); });
  $("#openPlan") && ($("#openPlan").onclick=()=>switchTab("plan"));
  $("#toNext") && ($("#toNext").onclick=()=>{ viewIdx=null; renderToday(); });
}
function completeDay(i){
  const day = DAYS[i]; st.done[`${st.cycle}|${day.k}`] = today(); bump(1); save(); haptic([20,40,20]);
  toast(`Week ${day.w} · ${DOW[day.d]} done`);
  viewIdx = null; renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}
function newCycle(){
  st.cycles.push({n:st.cycle, finished:today()}); st.cycle += 1; save(); viewIdx=null; renderAll();
  toast(`Cycle ${st.cycle} started. Move each exercise one step forward.`);
}

/* ---------- Session overlay ---------- */
let cur = null, wakeLock = null;
async function keepAwake(on){
  try{ if(on && "wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); } else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){}
}
function openSession(i,b){ cur={i,b}; renderSession(); $("#session").classList.add("open"); $("#session").scrollTop=0; keepAwake(true); history.pushState({s:1},""); }
function closeSession(){ $("#session").classList.remove("open"); cur=null; keepAwake(false); renderAll(); }
window.addEventListener("popstate",()=>{ if($("#sheet").classList.contains("open")) closeSheet(); else if(cur) closeSession(); });
function renderSession(){
  const day = DAYS[cur.i], b = cur.b, list = day.b[b]; const [a,t]=blockCount(day,b);
  const title = b==="main" ? day.t : BLOCKS[b].t;
  let h = `<div class="ohead"><div class="in"><div class="row" style="justify-content:space-between"><button class="back" id="sback">${ic("back",22,2.4)} Back</button><span class="pill ${a===t?"done":"accent"}">${a}/${t} done</span></div>
  <div class="eyebrow" style="margin-top:4px">Week ${day.w} · ${DOW[day.d]} · ${BLOCKS[b].s}</div><h1 style="font-size:26px">${esc(title)}</h1>
  <div class="progressbar" style="margin-top:10px"><i style="width:${t?a/t*100:0}%"></i></div></div></div><div class="obody">`;
  if(b==="main") h += `<div class="note">${esc(day.note)}</div>`;
  list.forEach((u,n)=>{ const e=EX[u]; const on=isTicked(day.k,b,u);
    h += `<div class="ex ${on?"on":""}" data-u="${u}"><button class="chk" data-tick="${u}" aria-label="Done">${ic("check",18,3)}</button>
    <div class="exbody" data-info="${u}"><div class="exname">${esc(e.n)}${e.sub?'<span class="sub">substitute</span>':""}</div>
    <div class="exdose">${esc(e.dose)}${e.rest?` <span class="muted" style="font-weight:600">· rest ${esc(e.rest)}</span>`:""}</div>
    <div class="exload">${esc(e.load)}</div><div class="ids">${e.ids.map(esc).join(" · ")}</div></div>
    <button class="info" data-info="${u}" aria-label="How to">${ic("info",18)}</button></div>`; });
  h += `</div><div class="sticky-cta"><div class="in"><button class="btn ${a===t?"done":"primary"}" id="sdone">${a===t?ic("check",20,2.6)+" All done · back to today":"Back to today"}</button></div></div>`;
  $("#session").innerHTML = h;
  $("#sback").onclick = ()=>history.back();
  $("#sdone").onclick = ()=>history.back();
  document.querySelectorAll("[data-tick]").forEach(el=>el.onclick=ev=>{ ev.stopPropagation(); toggle(el.dataset.tick); });
  document.querySelectorAll("[data-info]").forEach(el=>el.onclick=()=>openSheet(el.dataset.info));
}
function toggle(u){
  const day=DAYS[cur.i], k=tk(day.k,cur.b,u);
  if(st.ticks[k]){ if(st.ticks[k]===today()) bump(-1); delete st.ticks[k]; }
  else { st.ticks[k]=today(); bump(1); haptic(); }
  save();
  const [a,t]=blockCount(day,cur.b);
  renderSession();
  if(a===t && st.ticks[k]) toast(`${cur.b==="main"?day.t:BLOCKS[cur.b].t} complete`);
}

/* ---------- Exercise sheet ---------- */
function presets(e){
  const out=[]; const add=(s,l)=>{ if(s>0 && s<=1800 && !out.some(o=>o.s===s)) out.push({s,l}); };
  const m1 = /(\d+)(?:\s*[–-]\s*(\d+))?\s*s\b/.exec(e.dose); if(m1) add(+m1[1], `Hold ${m1[1]} s`);
  const m2 = /(\d+)(?:\s*[–-]\s*(\d+))?\s*min\b/.exec(e.dose); if(m2 && +m2[1]<=30) add(+m2[1]*60, `${m2[1]} min`);
  const r = e.rest||""; const r1=/(\d+)(?:\s*[–-]\s*\d+)?\s*s\b/.exec(r), r2=/(\d+)\s*min/.exec(r);
  if(r1) add(+r1[1], `Rest ${r1[1]} s`); else if(r2) add(+r2[1]*60, `Rest ${r2[1]} min`);
  [30,60,90].forEach(s=>add(s, `${s} s`));
  return out.slice(0,5);
}
function openSheet(u){
  const e=EX[u]; const steps=(e.how||"").split(/;\s*/).filter(Boolean);
  let h=`<div class="in"><div class="grab"></div><h3>${esc(e.n)}</h3><div class="ids" style="margin-top:0">${e.ids.map(esc).join(" · ")}</div>
  <div class="kv"><b>Dose</b><span style="font-weight:700">${esc(e.dose)}</span>${e.rest?`<b>Rest</b><span>${esc(e.rest)}</span>`:""}<b>Load</b><span>${esc(e.load)}</span></div>
  <div class="sec"><div class="lab">Timer</div><div class="timers">${presets(e).map(p=>`<button class="tchip" data-s="${p.s}" data-l="${esc(p.l)}">${ic("timer",18)}${esc(p.l)}</button>`).join("")}</div></div>`;
  if(steps.length) h+=`<div class="sec"><div class="lab">How to do it</div><ol class="steps">${steps.map(s=>`<li>${esc(s.replace(/\.$/,""))}</li>`).join("")}</ol></div>`;
  if(e.bad) h+=`<div class="sec"><div class="lab">Watch out</div><div class="warnbox">Ruined by ${esc(e.bad)}</div></div>`;
  h+=`<div class="sec ez"><div><div class="lab">Easier</div>${esc(e.e)}</div><div><div class="lab">Harder</div>${esc(e.h)}</div></div>`;
  if(e.gate) h+=`<div class="sec"><div class="lab">Safety</div><div class="small">${esc(e.gate)}</div></div>`;
  h+=`<div class="sec small muted">Evidence: ${esc(e.ev||"—")}${e.sub?" · Substitute (not in the library) for equipment you don't have":""}</div>
  <div style="margin-top:18px"><button class="btn ghost" id="shclose">Close</button></div></div>`;
  $("#sheet").innerHTML=h; $("#sheet").scrollTop=0;
  $("#sheet").classList.add("open"); $("#scrim").classList.add("open"); history.pushState({sh:1},"");
  $("#shclose").onclick=()=>history.back();
  document.querySelectorAll(".tchip").forEach(b=>b.onclick=()=>{ startTimer(+b.dataset.s, b.dataset.l); history.back(); });
}
function closeSheet(){ $("#sheet").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#scrim").onclick=()=>history.back();

/* ---------- Timer ---------- */
let tEnd=0, tInt=null, actx=null;
function fmt(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function startTimer(sec,label){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
  tEnd = Date.now()+sec*1000; $("#tlab").textContent=label; $("#timer").classList.remove("end"); $("#timer").classList.add("show");
  clearInterval(tInt); tick(); tInt=setInterval(tick,250);
}
function tick(){
  const left=(tEnd-Date.now())/1000; $("#tval").textContent=fmt(left);
  if(left<=0){ clearInterval(tInt); $("#timer").classList.add("end"); $("#tval").textContent="Done"; haptic([200,100,200]); beep(); setTimeout(()=>{ if(Date.now()-tEnd>3500) $("#timer").classList.remove("show"); },4000); }
}
function beep(){ try{ if(!actx) return; [0,0.25,0.5].forEach(t=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.25,actx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.18); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.2); }); }catch(e){} }
$("#tplus").onclick=()=>{ if(Date.now()>tEnd){ tEnd=Date.now(); $("#timer").classList.remove("end"); clearInterval(tInt); tInt=setInterval(tick,250);} tEnd+=15000; tick(); };
$("#tstop").onclick=()=>{ clearInterval(tInt); $("#timer").classList.remove("show"); };

/* ---------- Plan ---------- */
function renderPlan(){
  const ni = nextIdx();
  let h=`<div class="eyebrow">Cycle ${st.cycle}</div><h1>Plan</h1><div class="muted">21 days, in order. Skip whenever you need to; tap a day to open it.</div>`;
  ["A","B","C"].forEach(w=>{
    const days = DAYS.map((d,i)=>({d,i})).filter(x=>x.d.w===w);
    const nd = days.filter(x=>isDone(x.d.k)).length;
    h+=`<div class="card wk"><div class="wkhead"><div style="font-weight:800;font-size:17px">Week ${w}</div><div class="small muted">${nd}/7 days</div></div><div class="grid7">`;
    days.forEach(({d,i})=>{ const [a,t]=coreCount(d); const done=isDone(d.k); const next=i===ni&&!done;
      h+=`<button class="dt ${done?"done":""} ${next?"next":""}" data-day="${i}" aria-label="Week ${w} ${DOW[d.d]}"><span>${d.d.slice(0,2)}</span><span class="ic">${ic(done?"check":d.icon,20,2.2)}</span><span class="mini"><i style="width:${t?a/t*100:0}%"></i></span></button>`; });
    h+=`</div></div>`;
  });
  h+=`<div class="legend"><span><i class="sw" style="background:var(--done)"></i>Done</span><span><i class="sw" style="outline:2px solid var(--accent);background:var(--accent-soft)"></i>Up next</span><span><i class="sw" style="background:var(--accent)"></i>Bar = main + 11:00 ticked</span></div>`;
  h+=`<h2>Session types</h2><div class="card">${[["legs","Mon · Fri","Lower body strength"],["arms","Tue · Thu","Upper body strength"],["bolt","Wed","Power, sprints, intervals (outdoors)"],["route","Sat","Long outing: walk–run, hills"],["flame","Sun","Conditioning & agility"]].map(([i,dd,t])=>`<div class="row" style="padding:7px 0"><span class="badge">${ic(i,20)}</span><div class="grow"><div style="font-weight:650">${t}</div><div class="small muted">${dd}</div></div></div>`).join("")}</div>`;
  $("#v-plan").innerHTML=h;
  document.querySelectorAll("[data-day]").forEach(el=>el.onclick=()=>{ viewIdx=+el.dataset.day; switchTab("today"); });
}

/* ---------- Progress ---------- */
function streak(){
  const has = d => (st.act[d]||0)>0;
  const dt = new Date(); let n=0;
  const key = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  if(!has(key(dt))) dt.setDate(dt.getDate()-1);
  while(has(key(dt))){ n++; dt.setDate(dt.getDate()-1); }
  return n;
}
function renderProgress(){
  const cycDone = DAYS.filter(d=>isDone(d.k)).length;
  const totalDays = Object.keys(st.done).length;
  const totalTicks = Object.keys(st.ticks).length;
  const last7 = (()=>{ let c=0; const d=new Date(); for(let i=0;i<7;i++){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(st.act[k]) c++; d.setDate(d.getDate()-1);} return c; })();
  // cycle ticks
  let cycTicks=0, cycTotal=0; const dom={}; Object.keys(DOMN).forEach(k=>dom[k]=[0,0]);
  DAYS.forEach(d=>Object.entries(d.b).forEach(([b,l])=>l.forEach(u=>{ cycTotal++; const on=isTicked(d.k,b,u); if(on) cycTicks++; dom[EX[u].dom][1]++; if(on) dom[EX[u].dom][0]++; })));
  let h=`<div class="eyebrow">Cycle ${st.cycle}</div><h1>Progress</h1>
  <div class="card" style="margin-top:14px"><div class="hero">${ring(cycDone/21,108,11,`${Math.round(cycDone/21*100)}%`)}<div class="grow"><div style="font-weight:800;font-size:20px">${cycDone} of 21 days</div><div class="muted small">${cycTicks} of ${cycTotal} exercises ticked this cycle</div><div class="progressbar" style="margin-top:10px"><i style="width:${cycTotal?cycTicks/cycTotal*100:0}%"></i></div>${st.cycles.length?`<div class="small muted" style="margin-top:8px">${st.cycles.length} cycle${st.cycles.length>1?"s":""} finished before this one</div>`:""}</div></div></div>
  <div class="tiles"><div class="tile"><div class="v">${streak()}</div><div class="l">Day streak</div></div><div class="tile"><div class="v">${last7}<span class="muted" style="font-size:16px">/7</span></div><div class="l">Active days this week</div></div><div class="tile"><div class="v">${totalDays}</div><div class="l">Workout days completed</div></div><div class="tile"><div class="v">${totalTicks}</div><div class="l">Exercises ticked, all time</div></div></div>`;
  // heatmap 16 weeks ending this week (Mon start)
  const end=new Date(); const dow=(end.getDay()+6)%7; const start=new Date(end); start.setDate(end.getDate()-dow-7*15);
  let cells=""; const d=new Date(start);
  for(let i=0;i<16*7;i++){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); const v=st.act[k]||0; const lv=v===0?0:v<5?1:v<12?2:v<22?3:4; const fut=d>end;
    cells+=`<i title="${k}: ${v}" style="background:var(--heat${lv});${fut?"opacity:.3":""}"></i>`; d.setDate(d.getDate()+1); }
  h+=`<h2>Activity</h2><div class="card"><div class="heat">${cells}</div><div class="legend" style="margin-top:10px"><span>Less</span>${[0,1,2,3,4].map(l=>`<i class="sw" style="background:var(--heat${l})"></i>`).join("")}<span>More</span></div></div>`;
  h+=`<h2>Whole-body balance</h2><div class="card bars"><div class="small muted" style="margin-bottom:4px">Share of each domain's exercises ticked this cycle. The aim is every bar filling, not just your favourites.</div>${Object.entries(DOMN).map(([k,n])=>{ const [a,t]=dom[k]; const p=t?a/t:0; return `<div class="b"><span>${n}</span><div class="progressbar"><i style="width:${p*100}%;${p>=1?"background:var(--done)":""}"></i></div><span class="pct">${Math.round(p*100)}%</span></div>`; }).join("")}</div>`;
  const rec = Object.entries(st.done).filter(([k])=>k.startsWith(st.cycle+"|")).sort((a,b)=>b[1].localeCompare(a[1])).slice(0,6);
  if(rec.length){ h+=`<h2>Recent days</h2><div class="card">${rec.map(([k,dt])=>{ const dk=k.split("|").slice(1).join("|"); const day=DAYS.find(x=>x.k===dk); return `<div class="recent"><span class="badge g">${ic("check",18,2.6)}</span><div class="grow"><div style="font-weight:650">Week ${day.w} · ${DOW[day.d]}</div><div class="small muted">${esc(day.t)}</div></div><div class="small muted">${new Date(dt+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})}</div></div>`; }).join("")}</div>`; }
  h+=`<div style="margin-top:26px;display:grid;gap:10px"><button class="btn ghost" id="pnew">Start a new cycle</button><button class="danger" id="preset" style="padding:10px">Reset all data on this phone</button></div>
  <p class="small muted" style="text-align:center;margin-top:14px">Progress is saved in this browser only.</p>`;
  $("#v-progress").innerHTML=h;
  $("#pnew").onclick=()=>{ if(confirm(`Finish cycle ${st.cycle} and start cycle ${st.cycle+1}? Ticks start fresh; history stays.`)) newCycle(); };
  $("#preset").onclick=()=>{ if(confirm("Delete all progress saved on this phone?")){ st={cycle:1,ticks:{},done:{},act:{},cycles:[]}; save(); viewIdx=null; renderAll(); } };
}

/* ---------- tabs ---------- */
let tab="today";
function switchTab(t){ tab=t; document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+t)); if(t!=="today") viewIdx=null; renderAll(); window.scrollTo(0,0); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ if(b.dataset.tab==="today") viewIdx=null; switchTab(b.dataset.tab); });
function renderAll(){ if(tab==="today") renderToday(); if(tab==="plan") renderPlan(); if(tab==="progress") renderProgress(); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && cur) keepAwake(true); });
renderAll();
</script>
</body>
</html>
