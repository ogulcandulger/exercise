<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Ex">
<title>Life Exercises</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff6a3d'/%3E%3Cpath d='M18 34l9 9 19-21' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f3; --text:#14161a; --muted:#6b7280; --line:#e3e6ea;
  --accent:#ff6a3d; --accent-ink:#ffffff; --accent-soft:#ffe8df; --done:#1fae5b; --done-soft:#dcf5e6;
  --warn:#d97706; --ring-track:#e6e8ec; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.06);
  --heat0:#e9ecef; --heat1:#ffd3c2; --heat2:#ffab8b; --heat3:#ff8456; --heat4:#ff6a3d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --surface:#181b21; --surface2:#20242c; --text:#f2f3f5; --muted:#9aa2ae; --line:#2a2f38;
    --accent:#ff7a4f; --accent-ink:#1a0d07; --accent-soft:#3a2219; --done:#34d27b; --done-soft:#143524;
    --ring-track:#2a2f38; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --heat0:#20242c; --heat1:#4a2a1f; --heat2:#7a3a24; --heat3:#c4552d; --heat4:#ff7a4f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 160px)}
h1{font-size:30px;line-height:1.1;margin:4px 0 2px;letter-spacing:-.02em;font-weight:800}
h2{font-size:19px;margin:22px 0 10px;letter-spacing:-.01em;font-weight:750}
.eyebrow{font-size:13px;font-weight:650;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--done-soft);color:var(--done)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font-weight:700;font-size:16px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.done{background:var(--done);color:#fff}
.btn:active{transform:scale(.98)}
.progressbar{height:8px;border-radius:99px;background:var(--ring-track);overflow:hidden}
.progressbar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
/* session cards on Today */
.scard{display:flex;gap:14px;align-items:center;padding:16px;margin-top:12px}
.scard .title{font-weight:750;font-size:17px}
.scard .meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.ring{flex:none}
.ring text{font-weight:800;fill:var(--text)}
.chev{color:var(--muted);flex:none}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);margin-top:8px;box-shadow:var(--shadow)}
.opt .t{font-weight:650}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.badge.big{width:52px;height:52px;border-radius:16px}
.badge.g{background:var(--done-soft);color:var(--done)}
.banner{margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--done-soft);color:var(--done);font-weight:650;display:flex;gap:10px;align-items:center}
.linkbtn{color:var(--accent);font-weight:650;font-size:14px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px)}
.tabbar .in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:650;color:var(--muted)}
.tab.on{color:var(--accent)}
/* plan grid */
.wk{margin-top:12px;padding:14px}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dt{aspect-ratio:.78;border-radius:14px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 2px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.dt .ic{color:var(--text);opacity:.85}
.dt.done{background:var(--done);color:#fff}
.dt.done .ic{color:#fff;opacity:1}
.dt.next{outline:2.5px solid var(--accent);outline-offset:-2.5px;background:var(--accent-soft);color:var(--accent)}
.dt.next .ic{color:var(--accent)}
.dt .mini{width:100%;height:4px;border-radius:9px;background:var(--ring-track);overflow:hidden;margin:0 5px;max-width:30px}
.dt .mini i{display:block;height:100%;background:var(--accent)}
.dt.done .mini{display:none}
.dt.sel{outline:2.5px solid var(--accent);outline-offset:-2.5px;background:var(--accent-soft);color:var(--accent)}
.dt.sel .ic{color:var(--accent)}
.dt.done.sel{background:var(--done);color:#fff;outline-offset:2px}
.dt.done.sel .ic{color:#fff}
.dt.nextdot::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
/* session overlay */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.overlay.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.ohead{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;border-bottom:1px solid var(--line)}
.ohead .in{max-width:560px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:650;height:36px}
.obody{max-width:560px;margin:0 auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 120px)}
.ex{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:18px;padding:14px;margin-top:10px;box-shadow:var(--shadow);transition:opacity .2s}
.ex.on{opacity:.62}
.ex.on .exname{text-decoration:line-through;text-decoration-thickness:1.5px}
.chk{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex:none;margin-top:2px;transition:all .15s;color:transparent}
.ex.on .chk{background:var(--done);border-color:var(--done);color:#fff}
.chk:active{transform:scale(.9)}
.exbody{flex:1;min-width:0}
.exname{font-weight:700;font-size:16px}
.exdose{font-weight:750;font-size:15px;margin-top:3px;color:var(--accent)}
.exload{font-size:13.5px;color:var(--muted);margin-top:2px}
.ids{font-size:11.5px;color:var(--muted);margin-top:6px;letter-spacing:.01em}
.sub{font-size:11px;font-weight:700;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
.info{flex:none;color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--surface2);margin-top:3px}
.note{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-top:10px}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:3}
.sticky-cta .in{max-width:560px;margin:0 auto}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;padding:10px 18px calc(env(safe-area-inset-bottom) + 24px)}
.sheet.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet .in{max-width:560px;margin:0 auto}
.glink{display:block;text-decoration:none;color:inherit;margin-bottom:6px}.glink h3{margin:0}.glink .small{color:var(--accent);font-weight:650}.gicon{color:var(--accent);vertical-align:-2px}
.grab{width:44px;height:6px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:21px;margin:0 0 6px;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin-top:14px;font-size:14.5px}
.kv b{color:var(--muted);font-weight:650;font-size:13px;padding-top:1px}
.steps{margin:6px 0 0;padding-left:20px}
.steps li{margin:4px 0}
.sec{margin-top:16px}
.sec .lab{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:14px;padding:10px 12px;font-size:14.5px}
.timers{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tchip{height:40px;padding:0 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.ez{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ez div{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:14px}
.ez .lab{margin-bottom:2px}
/* timer pill */
.timer{position:fixed;left:50%;transform:translate(-50%,160%);bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:50;background:var(--text);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .25s,opacity .2s;min-width:250px;opacity:0;pointer-events:none}
.timer.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.timer .tt{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;letter-spacing:.02em}
.timer .tl{font-size:12px;opacity:.7;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:800;font-size:13px}
.timer.end{background:var(--done)}
/* progress */
.hero{display:flex;gap:18px;align-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.tile .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile .l{font-size:13px;color:var(--muted);margin-top:2px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:15px;height:15px;border-radius:4px;background:var(--heat0);display:block}
.bars .b{display:grid;grid-template-columns:118px 1fr 40px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
.bars .b .progressbar{height:10px}
.bars .b .pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.recent{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.recent:last-child{border-bottom:0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-150%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:650;font-size:14px;z-index:60;transition:transform .25s,opacity .2s;max-width:90vw;text-align:center;opacity:0;visibility:hidden;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.danger{color:#e5484d;font-weight:650;font-size:14px}

/* ---- v2 additions ---- */
:root{--joker:#7c5cff;--joker-soft:#ece7ff;--move:#3b82f6;--move-soft:#e3edff;--brk:#0ea5a4}
@media (prefers-color-scheme: dark){:root{--joker:#9b85ff;--joker-soft:#2a2346;--move:#5b9bff;--move-soft:#1b2a44;--brk:#2cc6c4}}
.hero2{padding:18px;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.howto{margin-top:12px}
.secbox{margin-top:12px;padding:14px 16px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sechead .t{font-weight:800;font-size:16px}
.rule{font-size:13.5px;color:var(--muted);margin-top:4px}
.rule b{color:var(--text)}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-of-type{border-top:0}
.num{width:28px;height:28px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:13.5px;flex:none}
.li.abs .num{background:var(--accent-soft);color:var(--accent)}
.li .nm{font-weight:700;font-size:15.5px}
.li .gd{font-size:13px;color:var(--muted);margin-top:1px}
.li .sd{font-size:11.5px;font-weight:700;color:var(--move);margin-top:2px}
.slot{font-size:11px;font-weight:750;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px}
.absdiv{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:10px 0 2px;border-top:1px dashed var(--line)}
.arrow{font-size:12.5px;color:var(--muted);padding:2px 0 0 40px}
.seq{font-size:14px;line-height:1.55}
.seq .s{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.seq .s:first-child{border-top:0}
.seq .s.run b{color:var(--accent)}
.jcard{background:linear-gradient(135deg,var(--joker),color-mix(in srgb,var(--joker) 60%,#ff6a3d));color:#fff;border-radius:20px;padding:16px;margin-top:14px;display:flex;gap:14px;align-items:center;width:100%;text-align:left;box-shadow:var(--shadow)}
.jcard .t{font-weight:800;font-size:16.5px}
.jcard .s{font-size:13px;opacity:.9}
.jcard .badge{background:rgba(255,255,255,.2);color:#fff}
.optc{padding:14px 16px;margin-top:10px}
.mini-btn{height:38px;padding:0 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:750;font-size:14px;display:inline-flex;align-items:center;gap:6px;flex:none}
.mini-btn.done{background:var(--done-soft);color:var(--done)}
.mini-btn.ghost{background:var(--surface2);color:var(--text)}
.dt.jok{background:var(--joker);color:#fff}.dt.jok .ic{color:#fff;opacity:1}
.navd{display:flex;gap:8px;margin-top:6px}
.navd button{flex:1;height:40px;border-radius:12px;background:var(--surface2);font-weight:650;font-size:14px;color:var(--muted)}
/* player */
.player{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.player.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ptop{padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;max-width:560px;width:100%;margin:0 auto}
.ptop .row{gap:10px}
.pclose{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.ptitle{font-weight:750;font-size:15px}
.pmeta{font-size:12.5px;color:var(--muted)}
.pbar{height:6px;border-radius:9px;background:var(--ring-track);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.pmain{flex:1;overflow-y:auto;max-width:560px;width:100%;margin:0 auto;padding:6px 16px 10px}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.phase.move{background:var(--move-soft);color:var(--move)}
.phase.brk{background:color-mix(in srgb,var(--brk) 16%,transparent);color:var(--brk)}
.phase.walk{background:var(--done-soft);color:var(--done)}
.pname{font-size:30px;font-weight:850;letter-spacing:-.02em;line-height:1.1;margin:12px 0 4px;display:flex;align-items:flex-start;gap:8px;text-align:left;width:100%}
.pname .i{flex:none;margin-top:6px;color:var(--muted)}
.pguide{font-size:16px;font-weight:700;color:var(--accent)}
.pside{display:inline-block;margin-top:8px;font-size:13px;font-weight:750;color:var(--move);background:var(--move-soft);padding:4px 10px;border-radius:99px}
.pclock{display:flex;justify-content:center;margin:14px 0 6px;position:relative}
.pclock .big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pclock .big b{font-size:56px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.pclock .big span{font-size:13px;color:var(--muted);font-weight:650;margin-top:4px}
.pcount{text-align:center;font-size:14px;font-weight:700;color:var(--muted)}
.pnext{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.pnext .l{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pnext .n{font-weight:750}
.pcues{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface2);font-size:14.5px}
.pcues ol{margin:6px 0 0;padding-left:20px}.pcues li{margin:3px 0}
.pcues .lab{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pctl{padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);max-width:560px;width:100%;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:center}
.pctl button{width:58px;height:58px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.pctl .pp{width:78px;height:78px;background:var(--accent);color:var(--accent-ink)}
.pctl .snd{width:44px;height:44px;font-size:12px;font-weight:800;color:var(--muted)}
.pdone{text-align:center;padding:40px 10px}
.pdone h2{font-size:28px;margin:16px 0 6px}
.pstart{text-align:center;padding:20px 4px}
</style>
</head>
<body>
<div class="app">
  <section id="v-today" class="view on"></section>
  <section id="v-plan" class="view"></section>
  <section id="v-progress" class="view"></section>

#27"], "eq": "Wall", "side": "switch", "g": "Hold each side", "set": "Stand side-on to a wall, the near hand on it. Cross the leg nearest the wall behind the other leg.", "st": ["Lean the hips toward the wall, keeping the body upright.", "Feel the stretch on the outside of the back hip.", "Hold and breathe.", "Halfway through: turn around and switch."], "br": "Breathe slowly.", "feel": "Outside of the hip and thigh.", "bad": ["Bending forward.", "Twisting."], "e": "Smaller lean.", "h": "Reach the free arm overhead."}, "crossover": {"n": "Crossover step and return", "lib": ["A4.2#7"], "eq": "Floor; a wall or chair within reach", "side": "alt", "g": "5–6 per side", "set": "Stand tall with feet hip-width, a wall or chair within reach.", "st": ["Step the right foot across in front of the left, putting weight on it.", "Step it back to the start.", "Then the left foot across in front of the right.", "Smooth and controlled. Eyes forward."], "br": "Breathe normally.", "feel": "Hips and ankles working for balance.", "bad": ["Looking at the feet.", "Rushing and stumbling."], "e": "Smaller steps.", "h": "Cross behind as well as in front."}, "crunch": {"n": "Crunch", "lib": ["B5#29", "A1.4#17"], "eq": "Mat or grass", "side": "", "g": "7–10 slow reps", "set": "Lie on your back, knees bent, feet flat. Fingertips lightly behind your ears, or arms crossed over your chest.", "st": ["Curl your head, then shoulders, then upper back off the floor by bringing the ribs toward the pelvis. The lower back stays on the floor.", "Lift until the shoulder blades are off the floor.", "Squeeze for 1 second at the top.", "Lower slowly for 2 seconds."], "br": "Breathe OUT completely as you curl up.", "feel": "Upper part of the stomach.", "bad": ["Pulling on the head.", "Jerking up with momentum.", "Sitting all the way up (that is hip flexor work)."], "e": "Arms reaching toward the knees.", "h": "Arms straight overhead, or a 3 s squeeze at the top."}, "deadbug": {"n": "Dead bug", "lib": ["B5#38", "A8.3#10", "A3.2#1"], "eq": "Mat", "side": "alt", "g": "3–5 slow reps per side", "set": "Lie on your back. Arms pointing straight up to the ceiling. Lift your legs so the hips and knees are bent at 90° (shins parallel to the floor).", "st": ["Press your low back flat into the floor; keep it there the whole time.", "Slowly lower one arm behind your head and the OPPOSITE leg straight out, heel hovering 5–10 cm above the floor (2–3 seconds).", "Bring them back to the start.", "Repeat with the other arm and leg."], "br": "Breathe out slowly as you extend the arm and leg.", "feel": "Deep in the stomach, holding the low back flat.", "bad": ["Low back lifting off the floor. If this happens, don't extend the leg as far.", "Moving fast."], "e": "Move only the legs, or tap the heel on the floor with the knee still bent.", "h": "Slower (4 s out), or hold a light band between your hands."}, "decelcut": {"n": "Deceleration cut", "lib": ["A5.4#8", "A7.4#5"], "eq": "Flat path or grass, two markers 10 m apart", "side": "alt", "g": "Run, stop, cut, back", "set": "Mark a start and a point 10 m away.", "st": ["Run at medium speed to the marker.", "Stop in 2–3 short steps, sinking the hips, then push off the outside foot and turn back.", "Jog back. Alternate the cutting foot each time."], "br": "Breathe normally.", "feel": "Legs braking hard; hips and knees control.", "bad": ["Stopping in one stiff step.", "Knee caving in on the cut."], "e": "Slower run-up.", "h": "Faster run-up, sharper cut."}, "declinepu": {"n": "Feet-elevated push-up", "lib": ["B5#10", "A1.1#12"], "eq": "Chair, sofa seat or a stair", "side": "", "g": "6–10 reps", "set": "Put your feet on a chair seat or a stair behind you and your hands on the floor slightly wider than the shoulders. Body straight from head to heels.", "st": ["Lower the chest toward the floor, elbows at about 45°.", "Go down until the nose is close to the floor.", "Push back up to straight arms without letting the hips sag.", "If form breaks, put the "Rise up on BOTH feet.", "Lift one foot and lower slowly on the other leg over 3–4 seconds until the heel is below the step.", "Put the other foot back down, rise on both again, and lower on the other leg.", "Keep alternating legs."], "br": "Breathe out as you lower.", "feel": "Calf and Achilles tendon of the lowering leg.", "bad": ["Dropping quickly.", "Bending the knee to cheat.", "Rolling onto the outer edge of the foot."], "e": "Lower on both legs.", "h": "Lower over 5 seconds, or wear the backpack."}, "heelwalk": {"n": "Heel walk and toe walk", "lib": ["A3.3#3", "A5.2#5"], "eq": "Path", "side": "", "g": "15 s on heels, 15 s on toes", "set": "Stand tall on a flat path.", "st": ["Lift the toes and walk on the heels, small steps.", "Halfway through: rise onto the balls of the feet and walk on tiptoes.", "Stand tall the whole time."], "br": "Breathe normally.", "feel": "Front of the shins (heels), then calves (toes).", "bad": ["Leaning back on the heel walk.", "Bent knees on the toe walk."], "e": "Shorter time.", "h": "Longer steps."}, "hfreach": {"n": "Half-kneeling hip-flexor stretch with reach", "lib": ["A3.1#2", "A5.1#11"], "eq": "Mat", "side": "switch", "g": "Rock in and out, 4–5 times each side", "set": "Kneel on the mat with the left knee down and the right foot flat in front, both knees bent about 90°.", "st": ["Squeeze the left glute and tuck the tailbone under (tilt the pelvis back). You should already feel the front of the left hip.", "Keeping that tuck, shift the body slightly forward and reach the left arm straight up and a little toward the right.", "Hold for 2 seconds, come back, repeat.", "Halfway through: swap legs (right knee down, left arm reaches)."], "br": "Breathe out as you reach.", "feel": "A stretch at the front of the hip of the down knee.", "bad": ["Arching the low back instead of tucking the pelvis. If you arch, you lose the stretch."], "e": "Smaller forward shift.", "h": "Hold each reach 5 s."}, "hfstretch": {"n": "Half-kneeling hip-fle ve hard up the hill at about 90% effort: knees up, arms pumping strongly, short powerful steps on the balls of the feet.", "After 12–15 seconds, slow down and stop.", "Walk slowly back down to the start. That is your rest."], "br": "Powerful breaths.", "feel": "Glutes, hamstrings, calves. This builds sprint power and explosiveness.", "bad": ["Leaning from the waist instead of the ankles.", "Going again before you have caught your breath."], "e": "Fast running at 75–80%.", "h": "Steeper hill, or 2 more reps."}, "hipabd": {"n": "Side-lying hip abduction", "lib": ["A1.1#8", "A1.3#9"], "eq": "Mat", "side": "switch", "g": "5–7 per leg, 1 s pause at the top", "set": "Lie on your LEFT side, head resting on your stretched-out left arm. Bend the bottom (left) knee for support. Stack hips and shoulders. The top (right) leg is straight, in line with your body or very slightly behind it, kneecap and toes pointing forward (not up).", "st": ["Lift the top leg to about 30° (feet roughly shoulder-width apart), leading slightly with the heel.", "Pause for 1 second without letting the top hip roll backward.", "Lower slowly, stopping just before the top leg touches the bottom one.", "Halfway through: roll onto your right side and work the left leg."], "br": "Breathe out as you lift.", "feel": "Side of the hip and the upper outer part of the bum (gluteus medius) of the top leg.", "bad": ["Rolling the top hip back and turning the toes up, which hands the work to the hip flexors.", "Swinging the leg high.", "Letting the leg drift forward of the body."], "e": "Smaller lift.", "h": "Band looped just above the knees, or a 2 s pause at the top."}, "hipthrust": {"n": "Backpack hip thrust (paused)", "lib": ["A3.2#3", "A1.3#3"], "eq": "Sofa seat or bed edge (the upper back rests on it); backpack", "side": "", "g": "7–8 reps, 2 s pause at the top", "set": "Sit on the floor with your back against the side of the sofa or bed, so the edge sits just under your shoulder blades. Knees bent, feet flat. Backpack across the hips, held with both hands.", "st": ["Drive through the heels and lift the hips until the body is a flat table from shoulders to knees; the shins end up vertical.", "Hold 2 seconds, chin slightly tucked, ribs down, glutes squeezed.", "Lower the bum toward the floor and repeat."], "br": "Breathe out on the way up.", "feel": "Glutes, strongly at the top.", "bad": ["Arching the lower back at the top (look forward, not at the ceiling).", "Upper back sliding up the sofa.", "Feet too close, so the thighs take over."], "e": "No backpack, no pause.", "h": "Heavier backpack, or one leg at a time (switch halfway)."}, "hollow": {"n": "Hollow hold", "lib": ["B5#36", "A1.3#19"], "eq": "Mat", "side": "", "g": "Hold the whole time (rest 3–5 s if form breaks, then continue)", "set": "Lie on your back, legs straight, arms straight by your sides.", "st": ["Press your low back flat into the floor. This is the whole exercise.", "Lift your head and shoulder blades off the floor and reach your hands toward your feet.", "Lift your straight legs so the heels are about 15–30 cm off the floor.", "Hold that 'banana' shape. If the low back starts to lift off the floor, bend the knees or raise the legs higher."], "br": "Small, steady breaths. Do not hold your breath.", "feel": "Whole front of the stomach, especially the lower part.", "bad": ["Low back arching off the floor.", "Pulling the chin into the chest; look at your toes."], "e": "Knees bent to 90° (tuck hollow).", "h": "Arms extended overhead beside the ears."}, "hollowrock": {"n": "Hollow rock", "lib": ["B5#37", "A1.1#19", "A1.3#19"], "eq": "Mat", "side": "", "g": "Rock steadily the whole time", "set": "Lie on your back. Get into the hollow hold: lower back pressed into the floor, shoulders and legs lifted, arms by the ears or by your sides.", "st": ["Keeping that curved, rigid shape, rock gently forward and back like a rocking chair.", "The shape must not change; the body moves as one piece.", "If the lower back lifts, stop and go back to a still hollow hold."], "br": "Breathe shallow and steady.", "feel": "Whole front of the abs.", "bad": ["Lower back lifting off the floor.", "Bending at the hips to rock.", "Chin jutting forward."], "e": "Hollow hold with bent knees and arms by your sides.", "h": "Arms overhead and legs straight, lower."}, "inchworm": {"n": "Inchworm", "lib": ["B5#27", "A6.1#6", "A3.1#1"], "eq": "Floor space about 2 m", "side": "", "g": "4–6 slow reps", "set": "Stand tall, feet hip-width.", "st": ["Bend forward and put the hands on the floor (bend the knees as much as you need).", "Walk the hands forward one at a time to a high plank. Hold 1 second.", "Walk the hands back to the feet, keeping the legs as straight as you comfortably can.", "Stand up and repeat."], "br": "Breathe normally.", "feel": "Back of the legs (stretch), shoulders and abs.", "bad": ["Hips sagging in the plank.", "Rushing.", "Forcing straight legs: bend the knees if you need to."], "e": "Walk out only halfway.", "h": "Add a push-up in the plank."}, "jog": {"n": "Easy jog", "lib": ["A7.4#1", "A2.2#2", "A7.3#2"], "eq": "Path", "side": "", "g": "Conversational pace", "set": "Running segments of your walk–run.", "st": ["Run at a pace where you could still talk in full sentences (about 6/10 effort). Slower than you think.", "Short, quick steps (feet land under your hips, not far in front). Relaxed shoulders, arms swinging forward and back at about 90°.", "Look ahead, not down at your feet.", "If you can't speak in sentences, slow down or walk earlier."], "br": "Breathe through the mouth and nose, in rhythm with your steps.", "feel": "Comfortable, controlled effort.", "bad": ["Running too fast in the first jog blocks.", "Over-striding (heel landing far in front of the body)."], "e": "Walk more, jog less.", "h": "Longer jog blocks."}, "kickrdl": {"n": "Kickstand backpack RDL", "lib": ["B5#4", "A1.1#3", "A7.2#13"], "eq": "Backpack (as heavy as you have)", "side": "switch", "g": "5–6 per leg", "s st marching knee drive).", "h": "Stronger band, or stand further away."}, "kneelpress": {"n": "Half-kneeling single-arm band press", "lib": ["A1.1#13", "A1.3#12"], "eq": "Band", "side": "switch", "g": "5–6 per arm", "set": "Kneel on your RIGHT knee, left foot forward. Lay the band under the right knee AND shin so a good length of it is trapped under your body weight (don't pin just the end). Hold the other end in your right hand at shoulder height, palm facing forward. Check it can't slip out before you press.", "st": ["Squeeze the glute of the down knee so you stay tall.", "Press the hand straight up until the arm is beside your ear.", "Lower slowly to the shoulder.", "Halfway through: switch sides."], "br": "Breathe out as you press.", "feel": "Shoulder (front and side), triceps; side of the waist keeps you upright.", "bad": ["Leaning away from the band.", "Arching the lower back.", "Pressing forward instead of up."], "e": "Lighter band, or shorten the press.", "h": "Stronger band, or 2 s pause overhead."}, "kneeschest": {"n": "Knees-to-chest hold", "lib": ["A3.1#13"], "eq": "Mat", "side": "", "g": "Hold", "set": "Lie on your back.", "st": ["Pull both knees toward your chest with your hands around the shins or behind the knees.", "Relax the shoulders and head on the floor. Gently rock side to side if it feels good."], "br": "Slow, deep breaths into the belly.", "feel": "Low back relaxing.", "bad": ["Lifting the head."], "e": "One knee at a time.", "h": "—"}, "latlunge": {"n": "Lateral lunge (alternating)", "lib": ["A3.2#5", "A7.4#5"], "eq": "None", "side": "alt", "g": "5–6 per side", "set": "Stand with feet together, hands clasped in front of your chest.", "st": ["Take a big step out to the right (about twice shoulder-width), toes pointing forward.", "Sit back into the right hip, bending the right knee while the left leg stays straight. Chest up, right heel down.", "Go down until the right thigh is close to parallel to the floor or you feel a stretch on the inside ly as high as is comfortable. Hold 2 seconds.", "Lower slowly. Repeat, holding the last one."], "br": "Breathe out as you press up.", "feel": "Gentle stretch along the front of the body; lower back moves into extension.", "bad": ["Hips lifting off the floor.", "Shrugging."], "e": "Stay on the forearms (sphinx).", "h": "Straighter arms."}, "proneT": {"n": "Prone T raise", "lib": ["A3.2#20", "A1.1#14"], "eq": "Mat or floor; folded towel for the forehead", "side": "", "g": "8 reps, 2 s hold", "set": "Lie face down, forehead on a folded towel, arms straight out to the sides like a T, thumbs pointing up.", "st": ["Squeeze the shoulder blades together and lift the arms a few centimetres off the floor.", "Hold 2 seconds.", "Lower slowly."], "br": "Breathe out as you lift.", "feel": "Middle of the upper back and the back of the shoulders.", "bad": ["Shrugging toward the ears.", "Lifting the head and chest instead of the arms."], "e": "Bend the elbows to 90° (W shape).", "h": "Hold a water bottle in each hand."}, "pullapart": {"n": "Band pull-apart", "lib": ["A3.2#20", "A1.1#30"], "eq": "Band", "side": "", "g": "15–20 reps", "set": "Stand tall, holding the band in both hands, shoulder-width apart, arms straight in front at shoulder height, palms down.", "st": ["Pull the band apart by moving the hands out to the sides until the band touches your chest. Arms stay straight.", "Squeeze the shoulder blades together and DOWN, not up.", "Return slowly."], "br": "Breathe out as you pull.", "feel": "Between the shoulder blades and the back of the shoulders.", "bad": ["Shrugging.", "Arching the low back.", "Bending the elbows."], "e": "Hands wider on the band.", "h": "Hands closer together, or a thicker band."}, "pulldown": {"n": "Kneeling band lat pulldown", "lib": ["B5#14", "A1.1#15", "A1.3#14", "A1.4#11"], "eq": "Band anchored HIGH (top of a door)", "side": "", "g": "10–15 reps", "set": "Anchor the band at the top of the door. Kneel facing the door with a pad under the knees, far e ck slowly to recover fully."], "br": "Fast, controlled breathing.", "feel": "Fast and light, not straining.", "bad": ["Sprinting flat-out from a standstill in the first weeks (hamstring risk).", "Tense shoulders and face."], "e": "Build to 70%.", "h": "Build to 90%."}, "suitcase": {"n": "Suitcase carry (backpack)", "lib": ["A8.1#5", "A1.1#20"], "eq": "Backpack (as heavy as you have) and 3–5 m of clear floor", "side": "switch", "g": "Walk slowly the whole half on each side", "set": "Hold the backpack by its top loop in your RIGHT hand, arm straight at your side, loop deep in the palm. Stand tall, shoulders level, ribs down.", "st": ["Brace the stomach and keep both shoulders and both hips level. Don't lean away from the bag or let it pull you toward it.", "Walk slowly and tall back and forth along your 3–5 m path. No room? March slowly on the spot, knees to hip height.", "Squeeze the loop hard the whole time.", "Halfway through: swap the bag to the LEFT hand."], "br": "Breathe steadily the whole time.", "feel": "Side of the waist opposite the bag, plus grip and forearm.", "bad": ["Leaning away from the bag.", "The shoulder of the carrying arm dropping or shrugging up.", "Rushing the steps."], "e": "Lighter backpack.", "h": "Heavier backpack, or slower steps with a 1 s pause standing on each foot."}, "superman": {"n": "Prone back extension (arms by sides)", "lib": ["A8.3#7", "A1.1#22"], "eq": "Mat; folded towel for the forehead", "side": "", "g": "5–6 reps, 3 s hold", "set": "Lie face down, arms by your sides, palms up, forehead on a folded towel. (A pillow under the hips makes it more comfortable.)", "st": ["Tuck the chin slightly; keep the eyes on the floor.", "Lift the head and chest a few centimetres, squeezing the shoulder blades toward your hips.", "Hold 3 seconds.", "Lower slowly."], "br": "Breathe out as you lift.", "feel": "Upper and middle back, along the spine.", "bad": ["Swinging up into a high arch.", "Throwing the head back to look forward.", "Lifting the legs to help."], "e": "Lift only the head and shoulders.", "h": "Arms out in a W, or a light backpack high on the upper back."}, "supery": {"n": "Prone Y raise (floor)", "lib": ["A1.1#30", "A8.3#7"], "eq": "Floor or mat", "side": "", "g": "8–10 reps, 2 s hold", "set": "Lie face down, arms stretched overhead in a 'Y' shape, thumbs pointing up. Forehead resting on a folded towel.", "st": ["Squeeze the shoulder blades down and back.", "Lift both arms a few centimetres off the floor, leading with the thumbs. Lift the chest only slightly; head stays in line (look at the floor).", "Hold 2 seconds, lower slowly."], "br": "Breathe out as you lift.", "feel": "Lower part of the upper back. Fights the forward neck and rounded shoulders.", "bad": ["Lifting the head and looking forward (neck strain).", "Shrugging."], "e": "Arms in a 'W' (elbows bent).", "h": "Hold 4 s."}, "thoracic": {"n": "Thoracic extension over chair back", "lib": ["A3.3#7", "A2.5#6"], "eq": "Chair with a firm back", "side": "", "g": "6–8 slow reps", "set": "Sit tall in a chair with a back that comes up to about your shoulder blades. Hands behind your head, elbows forward.", "st": ["Keep the bottom on the seat and the ribs down.", "Lean back over the top of the chair back, bending at the upper back (not the low back). Let the elbows open and lift the chest toward the ceiling.", "Hold for 2 seconds, then come back up to neutral."], "br": "Breathe in as you lean back.", "feel": "Mid-back (between the shoulder blades) opening up; the opposite of a desk hunch.", "bad": ["Pushing the head back and neck into extension.", "Arching from the low back."], "e": "Smaller range.", "h": "Hold 5 s each."}, "tibraise": {"n": "Wall tibialis raise", "lib": ["A1.1#11", "A1.3#8", "A8.2#5"], "eq": "Wall", "side": "", "g": "10–12 reps", "set": "Stand with your back and bum against a wall, feet about 30–40 cm in front of it, legs straight.", "st": ["Lift the toes and the front of both feet as high as you can, heels staying on the floor.", "Hold 1 second.", "Lower slowly, do not let the feet slap down."], "br": "Breathe normally.", "feel": "Front of the shins.", "bad": ["Bending the knees.", "Tiny lifts.", "Feet slapping down."], "e": "Feet closer to the wall.", "h": "Feet further from the wall, or one foot at a time."}, "toeraise": {"n": "Toe raise (shins)", "lib": ["A1.3#8", "A8.2#5"], "eq": "A tree, wall or lamppost", "side": "", "g": "15–20 reps", "set": "Stand with your back and bum against a tree or wall, heels about a foot-length (25–30 cm) out from it, legs straight.", "st": ["Keep the knees straight and the weight on the heels.", "Pull the toes and front of the feet up toward the shins as far as they go.", "Pause 1 second, then lower slowly; don't slap them down.", "Keep going until the front of the shins burns."], "br": "Breathe normally.", "feel": "Front of the shins.", "bad": ["Rocking the body back to lift the toes instead of using the shins.", "Slapping the feet down."], "e": "Heels closer to the wall.", "h": "Heels further out, or one leg at a time."}, "toestretch": {"n": "Kneeling top-of-foot stretch", "lib": ["A3.1#10"], "eq": "Mat or cushion", "side": "", "g": "Hold", "set": "Kneel on a mat with the tops of the feet flat on the floor.", "st": ["Sit back slowly onto your heels.", "To stretch more, lean back with hands behind you.", "Hold and breathe."], "br": "Breathe slowly.", "feel": "Front of the ankles and tops of the feet.", "bad": ["Forcing it into knee pain (put a cushion between bum and heels)."], "e": "Cushion between bum and heels.", "h": "Lean back and lift the knees a little."}, "towelreach": {"n": "Towel reach up the back", "lib": ["A3.2#19"], "eq": "Towel", "side": "switch", "g": "Hold, then repeat", "set": "Hold a towel behind your back: one hand high over the shoulder, the working hand low behind the back.", "st": ["Walk the low hand as far up the spine as it goes on its own.", "Let the top hand pull gently and hold 5 seconds.", "Let go of the towel with the top hand and hold the low hand there by itself for 5 seconds.", "Halfway through: switch hands."], "br": "Breathe normally.", "feel": "Front of the shoulder of the low arm.", "bad": ["Only pulling with the top hand.", "Leaning to the side."], "e": "Smaller range.", "h": "Longer holds."}, "trxcurl": {"n": "TRX biceps curl", "lib": ["B5#21", "A1.4#14", "A3.2#21", "A7.2#21"], "eq": "TRX, straps short", "side": "", "g": "10–15 reps", "set": "Face the anchor, holding the handles with palms facing up, arms straight in front of you at shoulder height. Lean back with the body straight. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)", "st": ["Keep the upper arms still and at shoulder height.", "Bend only at the elbows to curl your hands toward your forehead. Your body moves up toward the anchor.", "Squeeze the biceps for 1 second.", "Straighten the arms slowly to lower back."], "br": "Breathe out as you curl.", "feel": "Biceps (front of the upper arm).", "bad": ["Elbows dropping down, which turns it into a row.", "Hips sagging."], "e": "Stand more upright.", "h": "Walk the feet forward."}, "trxfallout": {"n": "TRX fallout (ab rollout)", "lib": ["B5#35", "A1.1#19"], "eq": "TRX, straps long (handles hanging at about knee to mid-calf height)", "side": "", "g": "8–12 reps", "set": "Face away from the anchor. Hold the handles with straight arms in front of your chest at shoulder height, palms down. Step your feet back toward the anchor until you lean forward a little. The more you lean, the harder it is. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)", "st": ["Squeeze glutes, tuck the tailbone under, and pull the ribs down so your body is one straight plank from heels to head.", "Keeping the arms straight, let the arms rise forward and overhead while your body falls forward as one piece.", "Go only as far as you can WITHOUT your low back arching (often until the arms are beside the ears).", "Pull the arms back down toward the hips, using your abs, to return to the start."], "br": "Breathe in as you fall out, breathe out hard as you pull back.", "feel": "Whole front of the stomach, working hard to stop the back from arching.", "bad": ["Low back sagging or arching at the far point. This is the most important thing to avoid.", "Bending at the hips (bum sticking out) to come back.", "Bending the elbows."], "e": "Stand more upright, or do it from your knees.", "h": "Feet further back so you lean more, or go further overhead."}, "trxfly": {"n": "TRX reverse fly", "lib": ["B5#19", "A3.2#20", "A3.2#18"], "eq": "TRX, straps short", "side": "", "g": "10–12 reps", "set": "Face the anchor, holding the handles with palms facing each other, arms straight in front of you at chest height. Lean back a little. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)", "st": ["With a small fixed bend in the elbows, open the arms out wide to the sides like wings, until they form a 'T' in line with your shoulders. Turn the hands as you go so that at the T the palms face forward and the thumbs point up and slightly back.", "Squeeze the shoulder blades together at the end and hold for 1 second.", "Bring the arms back in front slowly."], "br": "Breathe out as you open.", "feel": "Back of the shoulders, between the shoulder blades, and the rotator cuff (small muscles on the back of the shoulder blade). Opens up the chest; good against the forward neck.", "bad": ["Shrugging.", "Bending the elbows more as you pull (it becomes a row).", "Sagging hips."], "e": "Stand more upright.", "h": "Lean back more."}, "trxpike": {"n": "TRX pike", "lib": ["B5#34", "A1.1#19", "A1.1#23"], "eq": "TRX, foot cradles at mid-calf height", "side": "", "g": "5–8 slow reps", "set": "Put both feet in the foot cradles (toes down) and walk the hands out to a high plank, hands under the shoulders, face down. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)", "st": ["Keep the legs straight and lift the hips up high toward the ceiling, bringing the feet toward the hands.", "Go up until the body is an upside-down V.", "Lower slowly back to a straight plank without the hips sagging."], "br": "Breathe out as you lift.", "feel": "Lower abs, hip flexors, shoulders.", "bad": ["Bending the knees (that's a knee tuck).", "Hips sagging between reps.", "Swinging the straps sideways."], "e": "TRX knee tuck instead.", "h": "Lower over 3 seconds."}, "trxpress": {"n": "TRX chest press", "lib": ["B5#9", "A1.1#12"], "eq": "TRX, straps long (handles at about waist height)", "side": "", "g": "8–12 reps", "set": "Face AWAY from the door, a handle in each hand, arms straight in front at chest height, palms down. Walk your feet back toward the door and lean forward so your body is a straight plank at an angle. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)", "st": ["Keep the body rigid from head to heels.", "Bend the elbows and lower your chest between the handles, elbows at about 45° from the body.", "Go down until the hands are beside your chest.", "Push back up to straight arms. Keep the straps from touching your arms."], "br": "Breathe in down, out as you push.", "feel": "Chest, front of the shoulders, triceps; the abs hold you straight.", "bad": ["Hips sagging.", "Flaring the elbows straight out to the sides.", "Letting the handles drift wide apart."], "e": "Stand more upright (feet further from the door).", "h": "Walk the feet closer to the door so you lean further forward."}, "trxpullup": {"n": "TRX kneeling pull-up", "lib": ["B5#15", "A1.1#15", "A1.3#14"], "eq": "TRX, straps fully shortened; mat for the knees", "side": "", "g": "6–10 reps", "set": "Kneel on a mat facing the door, right under the anchor. Hold a handle in each hand with arms straight overhead, palms facing forward or each other. Sit back on your heels a little so the arms are fully stretched. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)", "st": ["Pull the shoulder blades down first.", "Pull your chest up toward the handles by driving the elbows down to your sides, rising up off your heels to tall kneeling.", "Use the legs only as much as you need; the back does the work.", "Lower slowly until the arms are straight overhead."], "br": "Breathe out as you pull up.", "feel": "Lats (sides of the back), biceps.", "bad": ["Pushing up mostly with the legs.", "Shrugging the shoulders to the ears.", "Dropping fast."], "e": "Use the legs more.", "h": "Kneel further from the anchor so you hang back more, or lower over 3 s."}, "trxrow": {"n": "TRX row", "lib": ["A1.1#14", "A1.4#12", "A4.2#17"], "eq": "TRX, straps short (fully shortened)", "side": "", "g": "8–10 reps", "set": "Face the anchor and hold one handle in each hand, palms facing each other. Walk your feet toward the anchor and lean back with straight arms until your body is a straight plank, heels on the floor. The more upright you are, the easier it is. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)", "st": ["Squeeze the glutes and keep the body straight from head to heels.", "Pull your chest up to the handles by driving your elbows back, close to your sides. First squeeze the shoulder blades together, then pull.", "At the top, the handles are beside your ribs. Hold 1 second.", "Lower slowly over 2 seconds until the arms are straight again."], "br": "Breathe out as you pull, in as you lower.", "feel": "Upper back between the shoulder blades and the back of the shoulders; a little biceps.", "bad": ["Hips sagging (body not a straight line).", "Shrugging the shoulders up to the ears.", "Dropping down fast."], "e": "Stand more upright.", "h": "Walk the feet further forward (more horizontal), or pause 2 s at the top."}, "trxtri": {"n": "TRX triceps extension", "lib": ["B5#13", "A1.1#18"], "eq": "TRX, straps long (handles at about waist height)", "side": "", "g": "8–12 reps", "set": "Face AWAY from the anchor, a handle in each hand, palms down. Lean forward with straight arms raised in front at about head height, body straight as a plank. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)", "st": ["Keeping the upper arms still, bend only the elbows so the hands come toward your forehead and the head goes forward between the arms.", "Go down until the hands are just above your head.", "Straighten the elbows to push back up.", "Body stays rigid."], "br": "Breathe in down, out up.", "feel": "Back of the upper arms (triceps).", "bad": ["Moving the upper arms (it becomes a press).", "Hips sagging.", "Elbows flaring out."], "e": "Stand more upright.", "h": "Walk the feet closer to the door so you lean further forward."}, "trxtuck": {"n": "TRX knee tuck", "lib": ["B5#33", "A1.1#23", "A1.3#19"], "eq": "TRX, foot cradles at mid-calf height", "side": "", "g": "7–10 reps", "set": "Sit on the floor FACING the anchor and slide your heels into the foot cradles from the front. Cross one leg over the other and roll onto your stomach, so the cradles sit on the tops of your feet and your toes point at the floor. Push up into a straight-arm plank, hands under the shoulders, and walk the hands forward until your feet are roughly under the anchor. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)", "st": ["Get a strong plank first: glutes squeezed, no sagging.", "Pull your knees toward your chest by rounding the low back slightly, bum rising a little.", "Pause 1 second.", "Push the legs back out slowly to a straight plank."], "br": "Breathe out as you tuck.", "feel": "Lower stomach and hip flexors; shoulders and stomach hold the plank.", "bad": ["Hips sagging when the legs go back.", "Shoulders drifting behind the hands."], "e": "No TRX: mountain climbers in slow motion (one knee at a time to the chest from a push-up position).", "h": "Pike: keep legs straight and lift the hips high."}, "trxy": {"n": "TRX Y raise", "lib": ["B5#20", "A1.1#30", "A3.2#20"], "eq": "TRX, straps short", "side": "", "g": "10–12 reps", "set": "Face the anchor and hold the handles with straight arms in front of you at chest height, palms facing down. Lean back slightly; start almost upright, because this one is hard. (TRX door anchor: hang it over the hinge side of a closed door that opens away from you.)", "st": ["Keep the arms STRAIGHT the whole time.", "Pull your body up by raising the arms up and out into a 'Y' shape above your head, thumbs pointing up.", "Squeeze the shoulder blades down and back at the top; do not shrug.", "Lower slowly back to the start."], "br": "Breathe out as you raise.", "feel": "Lower part of the upper back, below and between the shoulder blades. This is your main posture muscle.", "bad": ["Bending the elbows.", "Shrugging toward the ears.", "Arching the low back. Keep the glutes squeezed."], "e": "Stand more upright.", "h": "Lean back more, or pause 2 s at the top."}, "tspinerot": {"n": "Quadruped thoracic rotation", "lib": ["A3.2#14"], "eq": "Mat", "side": "switch", "g": "3 slow reps per side", "set": "Hands and knees, hands under the shoulders, knees under the hips. Put one hand behind your head.", "st": ["Swing that elbow down under your body toward the opposite wrist.", "Then turn it up and back toward the ceiling as far as the upper back allows, eyes following the elbow.", "Hold 2 seconds at the top.", "Halfway through: switch sides. Hips stay square."], "br": "Breathe out as you turn up.", "feel": "Upper and middle back (rotation).", "bad": ["Hips turning with the elbow.", "Rushing."], "e": "Smaller range.", "h": "Hold 3 s at the top."}, "walk": {"n": "Brisk walk", "lib": ["A5.1#1", "A2.2#1"], "eq": "Path", "side": "", "g": "Fast walk, about 110–120 steps a minute", "set": "Recovery between jog or sprint blocks, and the warm-up and cool-down.", "st": ["Walk briskly, arms swinging, upright postur /* ---------- storage ---------- */
const KEY = "lifeex.v2";
let st;
function fresh(){ return {cycle:1, done:{}, act:{}, log:[], cycles:[], voice:true}; }
function load(){ try{ st = JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ st = null; } if(!st) st = fresh(); if(st.voice===undefined) st.voice=true;
  if(!st.v3){ const n=Object.keys(st.done).filter(k=>k.startsWith(st.cycle+"|")).length; if(n){ st.cycles.push({n:st.cycle, end:new Date().toISOString().slice(0,10), days:n, note:"plan v2"}); st.cycle++; } st.v3=true; save(); } }

const dkey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

const ck = k => st.cycle+"|"+k;

/* ---------- build a session into timed steps ---------- */
function firstEx(s){ return s.k==="run" ? s.segs[0][0] : (typeof s.items[0]==="string" ? s.items[0] : s.items[0][0]); }
function build(secs){
  const S=[];
  secs.forEach((s,si)=>{
    if(si>0) S.push({p:"move", s:TR, x:firstEx(s), lab:"Get ready · "+s.title, sec:s.title});
    if(s.k==="flow"){
      s.items.forEach(([x,t],i)=>{ if(i>0 && s.t) S.push({p:"move", s:s.t, x, lab:"Next", sec:s.title});
        S.push({p:"work", x, s:t, sec:s.title, i, n:s.items.length, flow:1}); });
    } else if(s.k==="circuit"){
      const n=s.items.length;
      for(let r=0;r<s.rounds;r++) s.items.forEach((x,i)=>{
        if(r>0 && i===0) S.push({p:"brk", s:s.brk, x, lab:`Water break · round ${r+1} of ${s.rounds} next`, sec:s.title, r, R:s.rounds});
        else if(i>0) S.push({p:"move", s:s.trans, x, lab:"Move to next", sec:s.title, r, R:s.rounds});
        S.push({p:"work", x, s:s.work, sec:s.title, r, R:s.rounds, i, n, abs:i>=n-s.nabs});
      });
    } else {
      s.segs.forEach(([x,t,lab])=>S.push({p:x==="walk"?"walk":"work", run:1, x, s:t, lab, sec:s.title}));
    }
  });
  return S;
}
const total = secs => build(secs).reduce((a,b)=>a+b.s,0);

function secHTML(s){
  if(s.k==="flow"){
    return `<div class="card secbox"><div class="sechead"><div class="t">${esc(s.title)}</div><div class="small muted">${mins(s.items.reduce((a,b)=>a+b[1],0)+s.t*(s.items.length-1))} min</div></div>

    ${s.items.map(([x,t],i)=>exLine(x,i+1)).join("")}</div>`;
  }
  if(s.k==="circuit"){
    const n=s.items.length;
    let h=`<div class="card secbox"><div class="sechead"><div class="t">${esc(s.title)}</div><div class="small muted">${s.rounds} rounds</div></div>
    <div class="rule">Do <b>${s.work} s</b> of each exercise → <b>${s.trans} s</b> to move to the next → … through all ${n}. After #${n}, <b>${s.brk} s water break</b>, then start again at #1. <b>${s.rounds} rounds</b> total.</div>`;
    s.items.forEach((x,i)=>{ if(i===n-s.nabs && i>0) h+=`<div class="absdiv">${ic("flame",14,2.4)} Abs finisher (still part of the circuit)</div>`; h+=exLine(x,i+1,{abs:i>=n-s.nabs, slot:(s.slots&&i<n-s.nabs)?s.slots[i]:""}); });
    return h+`</div>`;
  }
  // run
  const rows=[]; const segs=s.segs, n=segs.length; let i=0;
  while(i<n){ const [x,t,lab]=segs[i];
    if(x!=="walk" && i+1<n && segs[i+1][0]==="walk"){
      const wk=segs[i+1][1]; let cnt=0, j=i;
      while(j<n && segs[j][0]===x && segs[j][1]===t){ cnt++; if(j+2<n && segs[j+1][0]==="walk" && segs[j+1][1]===wk && segs[j+2][0]===x && segs[j+2][1]===t) j+=2; else { j+=1; break; } }

    }

}

let actx=null, wl=null;
function audioInit(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){} }
function tone(f=880, dur=.15, t=0, vol=.28){ try{ if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.connect(g); g.connect(actx.destination); const s=actx.currentTime+t; g.gain.setValueAtTime(vol,s); g.gain.exponentialRampToValueAtTime(.001,s+dur); o.start(s); o.stop(s+dur+.02); }catch(e){} }

  const pre = !P.started;
  el.innerHTML=`<div class="ptop"><div class="row"><button class="pclose" id="px" aria-label="Close">${ic("x",20,2.4)}</button><div class="grow"><div class="ptitle">${esc(P.cfg.title)}</div><div class="pmeta">${fmt(remaining())} left of ${fmt(totalS())}</div></div><button class="pclose" id="pvoice" aria-label="Voice">${ic(st.voice?"vol":"mute",20)}</button></div><div class="pbar"><i style="width:${(1-remaining()/totalS())*100}%"></i></div></div>

    ${isWork && nxtW ? `<div class="pnext"><div class="grow"><div class="l">Next</div><div class="n">${esc(EX[nxtW.x].n)}</div></div><span class="muted small">${nxtW.run?fmt(nxtW.s):"after "+TR+" s"}</span></div>`:""}
    ${isWork && !nxtW ? `<div class="pnext"><div class="grow"><div class="l">Next</div><div class="n">Finish 🎉</div></div></div>`:""}
    <div class="pcues"><div class="lab">${s.p==="work"?"How":"Get set up"}</div>${s.p!=="work"?`<div style="margin-top:4px">${esc(e.set)}</div>`:""}<ol>${e.st.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>
  </div>
  <div class="pctl"><button class="snd" id="pprev" aria-label="Previous">${ic("prev",22)}</button><button class="pp" id="pp" aria-label="Play or pause">${ic(P.paused?"play":"pause",30)}</button><button class="snd" id="pnext" aria-label="Skip">${ic("next",22)}</button></div>`;
  $("#px").onclick=()=>{ if(P.started && !confirm("Stop this workout? Progress in this session won't be saved.")) return; closePlayer(); };
  $("#pvoice").onclick=()=>{ st.voice=!st.voice; save(); renderPlayer(); };
  $("#pname").onclick=()=>openSheet(s.x);
  $("#pp").onclick=togglePlay;
  $("#pnext").onclick=()=>{ P.cues={}; advance(); };
  $("#pprev").onclick=()=>{ P.cues={}; if(P.steps[P.idx].s-P.left>3 || P.idx===0){ P.left=P.steps[P.idx].s; } else { P.idx--; P.left=P.steps[P.idx].s; } P.endAt=Date.now()+P.left*1000; renderPlayer(); };
}
function announce(s){
  const e=EX[s.x];
  if(s.p==="move") say((s.lab&&s.lab.startsWith("Get ready")?"Get ready. ":"Next: ")+e.n);
  else if(s.p==="brk") say(`Water break. Round ${s.r+1} next. First up: ${e.n}`);
  else if(s.p==="walk") say(s.lab && s.lab.startsWith("Walk back") ? "Walk back and recover" : (s.lab||"Walk"));
  else if(s.run) say(`${s.lab}. ${mins(s.s)>=1?mins(s.s)+" minutes":s.s+" seconds"}`);
  else say(e.n+". Go!");
}
function togglePlay(){
  audioInit();
  if(P.paused){ P.paused=false; if(!P.started){ P.started=true; announce(P.steps[0]); tone(1100,.35); } P.endAt=Date.now()+P.left*1000; clearInterval(P.int); P.int=setInterval(loop,200); }
  else { P.paused=true; P.left=Math.max(0,(P.endAt-Date.now())/1000); clearInterval(P.int); try{ speechSynthesis.cancel(); }catch(e){} }
  haptic(10); renderPlayer();
}
function advance(silent){
  P.idx++; P.cues={};
  if(P.idx>=P.steps.length){ clearInterval(P.int); P.finished=true; tone(880,.2); tone(1100,.2,.22); tone(1320,.45,.44); haptic([200,100,200]); say("Workout complete. Well done!"); renderPlayer(); return; }
  const s=P.steps[P.idx]; P.left=s.s; P.endAt=(silent?P.endAt:Date.now())+s.s*1000;
  if(!silent){ s.p==="work" ? tone(1100,.35) : tone(660,.3); haptic(s.p==="work"?[80,60,80]:60); announce(s); }
  renderPlayer();
}
P.advance = advance;
function loop(){
  if(P.paused) return;
  const left=(P.endAt-Date.now())/1000; P.left=Math.max(0,left);
  const s=P.steps[P.idx]; const e=EX[s.x];
  const t=$("#pt"); if(t) t.textContent=fmt(P.left);
  const rp=document.querySelector(".pclock .rp"); if(rp){ const c=+rp.getAttribute("stroke-dasharray"); rp.setAttribute("stroke-dashoffset", c*(1-P.left/s.s)); }
  const bar=document.querySelector(".pbar i"); if(bar) bar.style.width=(1-remaining()/totalS())*100+"%";
  const meta=document.querySelector(".pmeta"); if(meta) meta.textContent=`${fmt(remaining())} left of ${fmt(totalS())}`;
  const sec=Math.ceil(left);
  if(sec<=3 && sec>=1 && !P.cues["c"+sec]){ P.cues["c"+sec]=1; tone(880,.12); }
  if(s.p==="work" && e.side==="switch" && !s.run && left<=s.s/2 && !P.cues.sw){ P.cues.sw=1; tone(990,.12); tone(990,.12,.18); haptic([60,40,60]); say("Switch sides"); }
  if(s.run && s.s>=120 && left<=60 && left>57 && !P.cues.m1){ P.cues.m1=1; say("One minute left"); }
  if(left<=0) advance();
}

/* ---------- Plan ---------- */
function renderPlan(){
  const ni=nextIdx(); const sel=viewIdx ?? ni;
  let h=`<div class="eyebrow">Cycle ${st.cycle}</div><h1>Plan</h1><div class="muted">28 days, in order. Skip whenever you need to; tap a day to open it.</div>`;
  [1,2,3,4].forEach(w=>{
    const days=DAYS.map((d,i)=>({d,i})).filter(x=>x.d.w===w);
    const nd=days.filter(x=>isDone(x.d.k)).length;
    h+=`<div class="card wk"><div class="wkhead"><div style="font-weight:800;font-size:17px">Week ${w} <span class="small muted" style="font-weight:600">· ${esc(DATA.weeknote[w].split(" · ")[0])}</span></div><div class="small muted">${nd}/7</div></div><div class="grid7">`;
    days.forEach(({d,i})=>{ const r=rec(d.k); const done=isDone(d.k); const jok=r.joker&&!r.main; const isSel=i===sel; const next=i===ni&&!done&&!isSel;
      h+=`<button class="dt ${done?(jok?"jok":"done"):""} ${isSel?"sel":""} ${next?"nextdot":""}" data-day="${i}" aria-label="Week ${w} ${DOW[d.d]}"><span>${d.d.slice(0,2)}</span><span class="ic">${ic(done?(jok?"joker":"check"):d.icon,20,2.2)}</span><span style="font-size:10px;font-weight:650">${mins(d.sec)}′</span></button>`; });
    h+=`</div></div>`;
  });
  h+=`<div class="legend"><span><i class="sw" style="background:var(--done)"></i>Done</span><span><i class="sw" style="background:var(--joker)"></i>Joker done</span><span><i class="sw" style="outline:2px solid var(--accent);background:var(--accent-soft)"></i>Selected</span><span><i class="sw" style="width:8px;height:8px;border-radius:50%;background:var(--accent)"></i>Up next</span></div>`;
  h+=`<h2>Your week</h2><div class="card">${[["legs","Mon","Legs & glutes + abs","Home circuit, 20 min"],["route","Tue","Easy run","Max 30 min · core optional"],["arms","Wed","Upper body & posture + abs","Home circuit, 20 min"],["bolt","Thu","Speed & agility run","Max 30 min · core optional"],["bolt","Fri","Legs, balance & agility + abs","Home circuit, 20 min"],["route","Sat","Steady run","Max 30 min · core optional"],["flame","Sun","Full-body burn + abs","Home circuit, 20 min"]].map(([i,dd,t,s])=>`<div class="row" style="padding:7px 0"><span class="badge">${ic(i,20)}</span><div class="grow"><div style="font-weight:650">${dd} · ${t}</div><div class="small muted">${s}</div></div></div>`).join("")}<div class="small muted" style="padding-top:6px">Every week uses new exercises for the same muscle jobs, so the whole body is trained every week. The Joker, the 11:00 neck block and the evening stretch change every week too.</div></div>
  <h2>How the 4 weeks build</h2><div class="card small">${[1,2,3,4].map(w=>`<div style="padding:5px 0"><b>Week ${w}:</b> ${esc(DATA.weeknote[w])}</div>`).join("")}<div style="padding:5px 0" class="muted">Work is always 30 s. It gets harder through the moves you're given, not the time. After week 4, start a new cycle (Progress tab): the same 4 weeks come back, so try to beat your reps, and switch to the “Harder” version of any move that felt easy.</div></div>
  <h2>All exercises</h2><div class="card">${Object.keys(EX).filter(x=>!["walk","jog"].includes(x)).sort((a,b)=>EX[a].n.localeCompare(EX[b].n)).map(x=>`<button class="li" data-ex="${x}"><div class="grow"><div class="nm">${esc(EX[x].n)}</div><div class="gd">${esc(EX[x].eq)}</div></div><span class="chev">${ic("chev",18)}</span></button>`).join("")}</div>`;
  $("#v-plan").innerHTML=h;
  document.querySelectorAll("[data-day]").forEach(el=>el.onclick=()=>{ viewIdx=+el.dataset.day; switchTab("today"); });
  bindEx($("#v-plan"));
}

/* ---------- Progress ---------- */
function streak(){ const has=d=>(st.act[d]||0)>0; const dt=new Date(); let n=0; if(!has(dkey(dt))) dt.setDate(dt.getDate()-1); while(has(dkey(dt))){ n++; dt.setDate(dt.getDate()-1); } return n; }
function newCycle(){ st.cycles.push({n:st.cycle, end:today(), days:DAYS.filter(d=>isDone(d.k)).length}); st.cycle++; viewIdx=null; save(); renderAll(); toast(`Cycle ${st.cycle} started`); }
function renderProgress(){
  const cyc=DAYS.filter(d=>isDone(d.k)).length;
  const last7=(()=>{ let c=0; const d=new Date(); for(let i=0;i<7;i++){ if(st.act[dkey(d)]) c++; d.setDate(d.getDate()-1);} return c; })();
  const totMin=Object.values(st.act).reduce((a,b)=>a+b,0);
  const cnt=w=>st.log.filter(l=>l.what===w).length;
  let h=`<div class="eyebrow">Cycle ${st.cycle}</div><h1>Progress</h1>
  <div class="card" style="margin-top:14px"><div class="hero">${ring(cyc/28,108,11,`${Math.round(cyc/28*100)}%`)}<div class="grow"><div style="font-weight:800;font-size:20px">${cyc} of 28 days</div><div class="muted small">this cycle${st.cycles.length?` · ${st.cycles.length} cycle${st.cycles.length>1?"s":""} finished before`:""}</div></div></div></div>
  <div class="tiles"><div class="tile"><div class="v">${streak()}</div><div class="l">Day streak</div></div><div class="tile"><div class="v">${last7}<span class="muted" style="font-size:16px">/7</span></div><div class="l">Active days, last 7</div></div><div class="tile"><div class="v">${totMin}</div><div class="l">Minutes trained</div></div><div class="tile"><div class="v">${cnt("main")}<span class="muted" style="font-size:16px"> + ${cnt("joker")}</span></div><div class="l">Sessions + Joker days</div></div></div>`;
  const end=new Date(); const dow=(end.getDay()+6)%7; const start=new Date(end); start.setDate(end.getDate()-dow-7*15);
  let cells=""; const d=new Date(start);
  for(let i=0;i<16*7;i++){ const k=dkey(d); const v=st.act[k]||0; const lv=v===0?0:v<10?1:v<20?2:v<35?3:4; const fut=d>end;
    cells+=`<i title="${k}: ${v} min" style="background:var(--heat${lv});${fut?"opacity:.3":""}"></i>`; d.setDate(d.getDate()+1); }
  h+=`<h2>Activity</h2><div class="card"><div class="heat">${cells}</div><div class="legend" style="margin-top:10px"><span>Less</span>${[0,1,2,3,4].map(l=>`<i class="sw" style="background:var(--heat${l})"></i>`).join("")}<span>More minutes</span></div></div>`;
  if(st.log.length){ h+=`<h2>Recent</h2><div class="card">${st.log.slice(0,8).map(l=>`<div class="recent"><span class="badge ${l.what==="joker"?"":"g"}" ${l.what==="joker"?'style="background:var(--joker-soft);color:var(--joker)"':""}>${ic(l.what==="joker"?"joker":l.what==="M"?"neck":l.what==="E"?"moon":l.what==="C"?"flame":"check",18,2.4)}</span><div class="grow"><div style="font-weight:650">${esc(l.label||"")}</div><div class="small muted">${l.min} min</div></div><div class="small muted">${new Date(l.d+"T12:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})}</div></div>`).join("")}</div>`; }
  h+=`<div style="margin-top:26px;display:grid;gap:10px"><button class="btn ghost" id="pnew">Start a new cycle</button><button class="danger" id="preset" style="padding:10px">Reset all data on this phone</button></div>
  <p class="small muted" style="text-align:center;margin-top:14px">Progress is saved in this browser only.</p>`;
  $("#v-progress").innerHTML=h;
  $("#pnew").onclick=()=>{ if(confirm(`Finish cycle ${st.cycle} and start cycle ${st.cycle+1}? Days start fresh; history stays.`)) newCycle(); };
  $("#preset").onclick=()=>{ if(confirm("Delete all progress saved on this phone?")){ st=fresh(); save(); viewIdx=null; renderAll(); } };
}

/* ---------- tabs ---------- */
let tab="today";
function switchTab(t){ tab=t; document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+t)); renderAll(); window.scrollTo(0,0); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function renderAll(){ if(tab==="today") renderToday(); if(tab==="plan") renderPlan(); if(tab==="progress") renderProgress(); }
renderAll();
</script>
</body>
